<style type="text/tailwindcss">
@layer components{
 .inp{@apply w-full text-sm bg-white}
 .lbl{@apply text-xs font-bold block mb-1}
 .b{@apply text-xs sm:text-sm font-bold inline-flex items-center gap-1.5 justify-center}
 .card{@apply bg-white}
 .chip{@apply text-[11px] font-bold px-2 py-0.5 inline-block}

<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Mali','Kanit',sans-serif;background:#FFF9F5;background-image:radial-gradient(#F3D9FA 1.5px,transparent 1.5px);background-size:30px 30px;color:#334155}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{border-radius:10px}
:root{--ink:#4a3f6b;--line:#9b86c9;--sh:rgba(140,110,200,.32)}
body{font-family:'Mali','Kanit',sans-serif;color:var(--ink);background:radial-gradient(circle at 12% 8%,#ffe3f0 0,transparent 38%),radial-gradient(circle at 92% 14%,#dff0ff 0,transparent 40%),radial-gradient(circle at 50% 100%,#e4fbee 0,transparent 45%),#fff8fd;background-attachment:fixed}
h1,h2,h3,h4,.b{font-family:'Fredoka','Mali','Kanit',sans-serif}
h1,h2,h3{letter-spacing:.2px}
.text-slate-800,.text-slate-700,.text-slate-600{color:var(--ink)!important}
.border-slate-800{border-color:var(--line)!important}
.card{border:3px solid var(--line)!important;border-radius:30px!important;background:linear-gradient(180deg,#fff,#fffafe)!important;box-shadow:inset 0 4px 0 #fff,inset 0 -5px 0 rgba(155,134,201,.12),0 7px 0 var(--sh),0 16px 26px rgba(170,140,220,.2)!important}
.b{border:3px solid var(--line)!important;border-radius:999px!important;padding:.4rem 1rem!important;position:relative;transition:transform .15s,box-shadow .15s;box-shadow:inset 0 3px 0 rgba(255,255,255,.75),inset 0 -4px 0 rgba(0,0,0,.07),0 5px 0 var(--sh),0 8px 12px rgba(150,120,200,.18)!important}
.b:hover{transform:translateY(-3px)!important}
.b:active{transform:translateY(3px)!important;box-shadow:inset 0 3px 0 rgba(255,255,255,.6),0 1px 0 var(--sh)!important}
.chip{border:2px solid var(--line)!important;border-radius:999px!important;box-shadow:inset 0 2px 0 rgba(255,255,255,.8),0 2px 0 var(--sh)}
.inp{border:2.5px solid #cdbfec!important;border-radius:18px!important;color:var(--ink)!important;box-shadow:inset 0 3px 6px rgba(155,134,201,.15);transition:.15s}
.inp:focus{outline:none;border-color:#ff9ec7!important;box-shadow:0 0 0 4px #ffd6e8,inset 0 2px 4px rgba(155,134,201,.12)}
table{border-collapse:separate;border-spacing:0}
header{border-bottom:4px solid var(--line)!important;border-radius:0 0 34px 34px;background:linear-gradient(180deg,#fff,#fff3fa)!important;box-shadow:0 7px 0 var(--sh),0 14px 24px rgba(170,140,220,.18)}
footer{border-top:3px solid var(--line)!important;border-radius:34px 34px 0 0;background:#fff3fa!important}
main{padding-top:1.5rem}
.mascot{filter:drop-shadow(0 5px 0 rgba(155,134,201,.35));animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(-3deg)}}
@media(prefers-reduced-motion:reduce){.mascot{animation:none}.b{transition:none}}
/* pastel palette */
.bg-emerald-300{background:#b9f0d6!important}.bg-emerald-200{background:#d2f7e6!important}
.bg-yellow-300{background:#ffe48f!important}.bg-yellow-200{background:#fff0b3!important}.bg-yellow-100,.bg-yellow-50,.bg-amber-100,.bg-amber-50{background:#fff8dc!important}
.bg-pink-300{background:#ffbcd9!important}.bg-pink-200{background:#ffd9ea!important}.bg-pink-100{background:#ffeaf3!important}
.bg-purple-300{background:#d7c6ff!important}.bg-purple-200{background:#e6dcff!important}.bg-purple-100{background:#f2ecff!important}
.bg-blue-300{background:#bcd9ff!important}.bg-blue-200{background:#d6e8ff!important}.bg-sky-300{background:#b8e6ff!important}
.bg-teal-300{background:#aeeee6!important}.bg-teal-200{background:#ccf6f1!important}
.bg-red-200{background:#ffc9d0!important}.bg-red-100,.bg-red-50{background:#ffe6ea!important}
.bg-slate-100,.bg-slate-50{background:#f4efff!important}.bg-slate-200{background:#e8e0fa!important}
::-webkit-scrollbar-thumb{background:#d7c6ff;border:2px solid var(--line)}

@media print{.np{display:none!important}body{background:#fff!important}.card{box-shadow:none!important;border:1px solid #ccc!important}}
</style>

<body class="min-h-screen flex flex-col selection:bg-pink-300">
<header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b-4 border-slate-800 px-4 py-3 np">
 <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
  <div class="flex items-center gap-3 cursor-pointer" onclick="setRole('teacher')">
   <svg viewBox="0 0 48 48" class="w-12 h-12 mascot" aria-hidden="true"><defs><radialGradient id="mg" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#ffd3e6"/><stop offset="1" stop-color="#ff9ec7"/></radialGradient></defs><circle cx="24" cy="24" r="20" fill="url(#mg)" stroke="#9b86c9" stroke-width="2.5"/><ellipse cx="16" cy="12" rx="6" ry="3" fill="#fff" opacity=".75" transform="rotate(-30 16 12)"/><circle cx="17" cy="25" r="3.2" fill="#4a3f6b"/><circle cx="31" cy="25" r="3.2" fill="#4a3f6b"/><circle cx="18" cy="24" r="1.1" fill="#fff"/><circle cx="32" cy="24" r="1.1" fill="#fff"/><ellipse cx="11" cy="31" rx="3.5" ry="2.2" fill="#ff7fae" opacity=".55"/><ellipse cx="37" cy="31" rx="3.5" ry="2.2" fill="#ff7fae" opacity=".55"/><path d="M20 31q4 4 8 0" stroke="#4a3f6b" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
   <div><h1 class="text-xl font-bold text-slate-800">Smart Classroom <span class="chip bg-yellow-300 font-normal">v3</span></h1><p class="text-xs text-slate-500 hidden sm:block">ระบบจัดการเรียนการสอน คะแนน แบบทดสอบ และงาน</p></div>
  </div>
  <div class="flex items-center gap-2">
   <button onclick="openQR()" class="b bg-teal-200"><i data-lucide="qr-code" class="w-4 h-4"></i><span class="hidden sm:inline">QR</span></button>
   <span id="role-text" class="chip bg-amber-100 text-sm py-1"></span>
   <button onclick="setRole(UI.role==='teacher'?'student':'teacher')" class="b bg-purple-300"><i data-lucide="refresh-cw" class="w-4 h-4"></i><span id="switch-text"></span></button>
  </div>
 </div>

<main class="flex-grow max-w-6xl w-full mx-auto px-3 py-4 md:p-6 space-y-6">
 <section id="teacher-view"><div id="tbody" class="space-y-4"></div></section>
 <section id="student-view" class="hidden"><div id="sbody" class="space-y-4"></div></section>
</main>
<footer class="bg-white border-t-2 border-slate-800 py-3 text-center text-xs font-bold text-slate-500 mt-8 np">Smart Class & Gradebook • Chibi Pastel ✨</footer>

<div id="modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden items-center justify-center p-3"><div id="modal-box" class="card max-w-2xl w-full max-h-[92vh] overflow-y-auto p-5 relative"></div></div>
<div id="dlg" class="fixed inset-0 bg-slate-900/60 z-[60] hidden items-center justify-center p-4"><div class="card max-w-sm w-full p-5 space-y-3"><p id="dlg-msg" class="text-sm font-bold whitespace-pre-line"></p><input id="dlg-in" class="inp hidden"><div id="dlg-btns" class="flex flex-col gap-2"></div></div></div>
<div id="quiz-overlay" class="fixed inset-0 bg-amber-50 z-[70] hidden overflow-y-auto"></div>
<div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-[80] hidden max-w-sm w-[90%] card bg-red-100 p-3 text-sm font-bold text-red-800 np"></div>

<script>
const KEY='smart_class_v3', $=id=>document.getElementById(id);
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtD=d=>d?new Date(d+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}):'-';
const icons=()=>{try{lucide.createIcons()}catch(e){}};
const nz=s=>String(s||'').replace(/^(นางสาว|นาย|เด็กชาย|เด็กหญิง|ด\.ช\.|ด\.ญ\.|น\.ส\.)/,'').replace(/\s+/g,'').toLowerCase();
const KL={content:'แผนการสอน/สไลด์',quiz:'แบบทดสอบ',worksheet:'แบบฝึกหัด',project:'ชิ้นงาน',column:'ช่องคะแนน'};
const GRADED=['quiz','worksheet','project','column'];

function seed(){
 const names=[['1001','นายสมชาย ขยันเรียน','ม.4/1'],['1002','นางสาวสมหญิง ตั้งใจดี','ม.4/1'],['1003','นายปัญญา มีสติ','ม.4/1'],['1004','นางสาววิไล เก่งกาจ','ม.4/2'],['1005','นายกิตติศักดิ์ ศรีสุข','ม.4/2']];
 const cols=[['t1','ใบงานที่ 1 ตัวแปร',10,[10,10,8,9,6]],['t2','ใบงานที่ 2 If-Else',10,[9,10,7,9,7]],['t3','Quiz 1 Python',20,[18,19,14,17,11]],['t4','สอบกลางภาค',30,[26,29,22,25,18]],['t5','สอบปลายภาค',30,[27,28,21,26,19]]];
 const scores={},items=cols.map(c=>{scores[c[0]]={};names.forEach((n,i)=>scores[c[0]][n[0]]=c[3][i]);return{id:c[0],subjectId:'s1',kind:'column',title:c[1],max:c[2]}});
 items.push({id:'c1',subjectId:'s1',kind:'content',title:'คาบที่ 1: แนวคิดอัลกอริทึม',desc:'Logical Thinking และ Flowchart',url:'',files:[]});
 items.push({id:'w1',subjectId:'s1',kind:'worksheet',title:'แบบฝึกหัด 1: เขียนโปรแกรมคำนวณเลข',desc:'เขียนโปรแกรม Python คำนวณผลรวม 1-100',assigned:today(),due:'',max:10,files:[]});
 items.push({id:'q1',subjectId:'s1',kind:'quiz',title:'แบบทดสอบ: พื้นฐาน Python',desc:'',assigned:today(),due:'',time:10,max:3,files:[],questions:[
  {id:'a',type:'choice',text:'ข้อใดคือคำสั่งแสดงผลใน Python?',pts:1,opts:['echo','print','cout','write'],ans:'2'},
  {id:'b',type:'tf',text:'Python เป็นภาษาที่ต้องคอมไพล์ก่อนรันเสมอ',pts:1,ans:'F'},
  {id:'c',type:'short',text:'ผลลัพธ์ของ 2**3 คืออะไร',pts:1,ans:'8'}]});
 return{years:[{id:'y1',name:'2569'}],terms:[{id:'tm1',yearId:'y1',name:'ภาคเรียนที่ 1'}],rooms:[{id:'r1',name:'ม.4/1'},{id:'r2',name:'ม.4/2'}],
  subjects:[{id:'s1',code:'CS101',name:'การเขียนโปรแกรมคอมพิวเตอร์ 1',termId:'tm1',roomIds:['r1','r2'],teacher:'ครูสมศรี มีเรียน'}],
  students:names.map((n,i)=>({id:n[0],no:i+1,name:n[1],room:n[2]})),items,scores,subs:{},attempts:{},notes:[],alerts:[],att:{},teacherSig:''};
}
let D=seed(),DB=null,saveT=null,busy=0,BC=null;try{BC=new BroadcastChannel(KEY)}catch(e){}
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('smart_class',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbGet=async()=>{DB=DB||await idb();return new Promise((res,rej)=>{const q=DB.transaction('kv').objectStore('kv').get('D');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};
const idbPut=async v=>{DB=DB||await idb();return new Promise((res,rej)=>{const x=DB.transaction('kv','readwrite');x.objectStore('kv').put(v,'D');x.oncomplete=res;x.onerror=x.onabort=()=>rej(x.error)})};
async function load(){let p=null;try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 try{p=await idbGet()}catch(e){}
 if(!p){try{p=JSON.parse(localStorage.getItem(KEY))}catch(e){}}
 D=p&&p.years?{...seed(),...p}:seed()}
function save(){clearTimeout(saveT);saveT=setTimeout(flush,400);return true}
async function flush(){clearTimeout(saveT);saveT=null;
 try{await idbPut(D);try{localStorage.removeItem(KEY)}catch(e){}BC&&BC.postMessage('u');checkSpace()}
 catch(e){if(e&&e.name==='QuotaExceededError')autoBackup(0,0,1);else{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(x){notify('บันทึกข้อมูลไม่สำเร็จ กรุณาสำรองข้อมูล (JSON) ไว้ก่อน')}}}}
addEventListener('pagehide',()=>{saveT&&flush()});document.addEventListener('visibilitychange',()=>{document.hidden&&saveT&&flush()});
/* ---------- storage meter + auto backup to Drive ---------- */
const MB=n=>(n/1048576).toFixed(n>1e8?0:1);
async function usage(){try{const e=await navigator.storage.estimate();return{u:e.usage||0,q:e.quota||0}}catch(e){return{u:0,q:0}}}
function updMeter(u,q){const m=$('meter');if(!m||!q)return;const p=u/q*100;m.innerHTML=`💾 ใช้ ${MB(u)} MB จาก ${MB(q)} MB (${p.toFixed(1)}%)<div class="h-2 mt-1 rounded bg-slate-200 border border-slate-800"><div class="h-full ${p>=80?'bg-red-400':'bg-emerald-400'}" style="width:${Math.min(100,p)}%"></div></div>`}
async function checkSpace(){const{u,q}=await usage();updMeter(u,q);if(q&&u/q>=0.8)autoBackup(u,q)}
function allFiles(){const a=[];D.items.forEach(it=>{const t=Date.parse(it.assigned)||0;(it.files||[]).forEach(f=>a.push([t,f]));(it.questions||[]).forEach(q=>q.img&&a.push([t,q.img]))});Object.values(D.subs).forEach(sb=>(sb.files||[]).forEach(f=>a.push([sb.at||0,f])));return a.filter(x=>x[1].data)}
function archive(){const a=allFiles().sort((x,y)=>x[0]-y[0]),tot=a.reduce((s,x)=>s+x[1].data.length,0);let fr=0;for(const[,f]of a){if(fr>=tot*.7)break;fr+=f.data.length;fh(f);f.arch=1;delete f.data}return fr}
function autoBackup(u,q,force){if(busy)return;busy=1;const msg=force?'พื้นที่จัดเก็บเต็ม':`พื้นที่ใช้ไปแล้ว ${(u/q*100).toFixed(0)}%`;
 showDlg(msg+' — ระบบจะสำรองข้อมูลทั้งหมด (เลือกบันทึกลง Google Drive ในหน้าต่างบันทึก) แล้วเคลียร์ไฟล์เก่าเพื่อเพิ่มพื้นที่ทันที',{btns:[{l:'สำรองและเพิ่มพื้นที่เลย',c:'bg-emerald-300',f:doBackup},{l:'ภายหลัง',f:()=>{busy=0}}]})}
async function doBackup(){let d=null;try{d=await window.claude.use('downloads')}catch(e){}
 if(!d){busy=0;notify('ฟังก์ชันบันทึกไฟล์ไม่พร้อมใช้งานในมุมมองนี้ กรุณาเปิดผ่าน claude.ai');return}
 try{await d.save({filename:`smartclass_backup_${new Date().toISOString().slice(0,10)}.json`,data:JSON.stringify(D)})}catch(e){busy=0;if(e.code!=='declined')notify('สำรองไม่สำเร็จ: '+(e.message||e.code));return}
 const fr=archive();await flush();busy=0;notify(`สำรองแล้ว และเคลียร์พื้นที่ ${MB(fr*0.75)} MB ไฟล์เก่าที่ย้ายไปไดร์ฟจะแสดงเป็น ☁️ (กู้คืนได้จากไฟล์สำรอง JSON)`)}
let UI={role:'teacher',tab:'grade',termId:null,subjectId:null,room:'ALL',open:null,student:null,sSub:null,sTab:'content',q:''};
let FR={},FORM=null,QD=null,QS=null,SUB=null,SIG=null;

/* ---------- helpers ---------- */
function showDlg(msg,{input,btns}){$('dlg-msg').textContent=msg;const i=$('dlg-in');i.value='';i.classList.toggle('hidden',!input);const b=$('dlg-btns');b.innerHTML='';
 btns.forEach(x=>{const e=document.createElement('button');e.className='b '+(x.c||'bg-slate-200');e.textContent=x.l;e.onclick=()=>{$('dlg').classList.add('hidden');$('dlg').classList.remove('flex');x.f&&x.f(i.value.trim())};b.appendChild(e)});
 $('dlg').classList.remove('hidden');$('dlg').classList.add('flex')}
const notify=m=>showDlg(m,{btns:[{l:'ตกลง',c:'bg-emerald-300'}]});
const confirmD=(m,f)=>showDlg(m,{btns:[{l:'ยืนยัน',c:'bg-pink-300',f},{l:'ยกเลิก'}]});
function openM(h){const b=$('modal-box');b.innerHTML=`<button onclick="closeM()" class="absolute top-3 right-3 text-slate-400 hover:text-slate-800"><i data-lucide="x-circle" class="w-6 h-6"></i></button>`+h;$('modal').classList.remove('hidden');$('modal').classList.add('flex');icons()}
function closeM(){$('modal').classList.add('hidden');$('modal').classList.remove('flex')}
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),6000)}
function toBlob(d){const[h,b]=d.split(',');const m=/:(.*?);/.exec(h)[1];const bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m})}
async function saveFile(name,data){let d=null;try{d=await window.claude.use('downloads')}catch(e){}
 if(!d){notify('ดาวน์โหลดไม่พร้อมใช้งานในมุมมองนี้ กรุณาเปิดผ่าน claude.ai');return}
 try{await d.save({filename:name,data})}catch(e){if(e.code!=='declined')notify('ดาวน์โหลดไม่สำเร็จ: '+(e.message||e.code))}}
const reg=f=>{const k=uid('f');FR[k]=f;return k};
function dlFile(k){const f=FR[k];if(f)saveFile(f.name,toBlob(f.data))}
function chips(files){return(files||[]).map(f=>{const k=reg(f);if(f.arch||!f.data)return`<button type="button" onclick="notify('ไฟล์นี้ถูกย้ายไปสำรองในไดร์ฟแล้ว เพื่อเปิดดูให้กู้คืนจากไฟล์สำรอง (JSON)')" class="chip bg-amber-100 mr-1">☁️ ${esc(f.name)}</button>`;return f.type&&f.type.startsWith('image/')?`<img src="${f.data}" title="${esc(f.name)}" onclick="dlFile('${k}')" class="inline-block h-20 rounded-lg border-2 border-slate-800 cursor-pointer mr-1">`:`<button type="button" onclick="dlFile('${k}')" class="chip bg-slate-100 hover:bg-slate-200 mr-1">📎 ${esc(f.name)}</button>`}).join('')}
function readFiles(list){return Promise.all([...list].map(f=>new Promise(res=>{if(f.size>26214400){notify(`ไฟล์ ${f.name} ใหญ่เกิน 25MB`);return res(null)}const r=new FileReader();r.onload=()=>res({name:f.name,type:f.type,size:f.size,data:r.result});r.readAsDataURL(f)}))).then(a=>a.filter(Boolean))}
const fileText=f=>{try{if(/^text\//.test(f.type)||/\.(txt|md|csv)$/i.test(f.name))return decodeURIComponent(escape(atob(f.data.split(',')[1])))}catch(e){}return''};
const fh=f=>{if(f.h)return f.h;let h=5381,s=f.data||'';for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return f.h=h+':'+s.length};
function csvEsc(v){return `"${String(v??'').replace(/"/g,'""')}"`}
function parseCSV(t){return t.replace(/^\uFEFF/,'').split(/\r?\n/).filter(l=>l.trim()).map(l=>{const o=[];let c='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch=='"'&&l[i+1]=='"'){c+='"';i++}else if(ch=='"')q=false;else c+=ch}else if(ch=='"')q=true;else if(ch==','){o.push(c.trim());c=''}else c+=ch}o.push(c.trim());return o})}

/* generic form modal */
function formModal(title,fields,vals,onSave){
 FORM={files:{}};let h=`<h3 class="text-xl font-extrabold text-slate-800 border-b-2 border-slate-100 pb-3 mb-3 pr-8">${title}</h3><div class="space-y-3">`;
 fields.forEach(f=>{const v=vals[f.k]??f.def??'';let el;

  else if(f.type==='select')el=`<select id="fm_${f.k}" class="inp">${f.opts.map(o=>`<option value="${esc(o.v)}" ${o.v==v?'selected':''}>${esc(o.l)}</option>`).join('')}</select>`;
  else if(f.type==='multi')el=f.opts.map(o=>`<label class="flex items-center gap-2 text-sm"><input type="checkbox" name="fm_${f.k}" value="${esc(o.v)}" ${(vals[f.k]||[]).includes(o.v)?'checked':''}>${esc(o.l)}</label>`).join('');
  else if(f.type==='files'){FORM.files[f.k]=[...(vals[f.k]||[])];el=`<input type="file" multiple class="text-xs" onchange="pickFiles('${f.k}',this)"><div id="fl_${f.k}" class="mt-2"></div>`}
  else el=`<input id="fm_${f.k}" type="${f.type||'text'}" ${f.type==='number'?'step="0.5"':''} value="${esc(v)}" class="inp" placeholder="${esc(f.ph||'')}">`;
  h+=`<div><label class="lbl">${f.label}${f.req?' *':''}</label>${el}</div>`});
 h+=`</div><div class="pt-4 flex gap-2"><button onclick="closeM()" class="b bg-slate-200 w-1/2">ยกเลิก</button><button id="fm-save" class="b bg-emerald-300 w-1/2">บันทึก</button></div>`;
 openM(h);fields.filter(f=>f.type==='files').forEach(f=>renderFl(f.k));
 $('fm-save').onclick=()=>{const o={};for(const f of fields){
   if(f.type==='files')o[f.k]=FORM.files[f.k];
   else if(f.type==='multi')o[f.k]=[...document.getElementsByName('fm_'+f.k)].filter(x=>x.checked).map(x=>x.value);
   else{let v=$('fm_'+f.k).value.trim();if(f.type==='number')v=v===''?'':parseFloat(v);o[f.k]=v}
   if(f.req&&(o[f.k]===''||o[f.k]==null||Number.isNaN(o[f.k])||(f.type==='multi'&&!o[f.k].length))){notify('กรุณากรอก: '+f.label);return}}
  if(onSave(o)!==false)closeM()}}
function pickFiles(k,inp){readFiles(inp.files).then(a=>{FORM.files[k].push(...a);renderFl(k);inp.value=''})}
function renderFl(k){$('fl_'+k).innerHTML=FORM.files[k].map((f,i)=>`<span class="chip bg-slate-100 mr-1 mb-1">${f.type&&f.type.startsWith('image/')?'🖼️':'📎'} ${esc(f.name)} <button onclick="FORM.files['${k}'].splice(${i},1);renderFl('${k}')" class="text-red-500 ml-1">✕</button></span>`).join('')}

 if(it.kind==='quiz'){const a=D.attempts[it.id+'|'+sid];if(a)return a.status==='cheated'?0:(a.auto||0)+(a.manual||0)}
 else{const s=D.subs[it.id+'|'+sid];if(s&&typeof s.score==='number')return s.score}return null}
function totals(s,st){const its=itemsOf(s.id,GRADED);let t=0,m=0;its.forEach(i=>{m+=+i.max||0;const v=scoreOf(i,st.id);if(typeof v==='number')t+=v});return{t,m,pct:m?t/m*100:0}}
function grade(p){const g=[[80,'A','emerald'],[75,'B+','teal'],[70,'B','blue'],[65,'C+','cyan'],[60,'C','yellow'],[55,'D+','orange'],[50,'D','amber']].find(x=>p>=x[0]);return g?{g:g[1],c:g[2]}:{g:'F',c:'pink'}}
const gchip=p=>{const g=grade(p);return `<span class="chip bg-${g.c}-100 text-${g.c}-800 border-${g.c}-500 border-2 font-black">${g.g}</span>`};

function status(it,sid){const s=D.subs[it.id+'|'+sid];
 if(!s)return(it.due&&today()>it.due)?{t:'เลยกำหนด ยังไม่ส่ง',c:'pink'}:{t:'ยังไม่ส่ง',c:'slate'};
 const late=it.due&&s.at>endDay(it.due);const g=typeof s.score==='number';
 return{t:(late?'ส่งล่าช้า':'ส่งตรงเวลา')+(g?` • ตรวจแล้ว ${s.score}/${it.max}`:' • รอตรวจ'),c:g?'emerald':late?'orange':'blue'}}

function sStatus(it,sid){const k=it.id+'|'+sid,sb=D.subs[k];if(!sb)return status(it,sid);
 const st=((D.stat||{})[sid]||{})[k],rec=!D.isStudentPack||!!st,g=typeof sb.score==='number'||(st&&st.g),late=it.due&&sb.at>endDay(it.due);
 return{t:(late?'ส่งล่าช้า':'ส่งตรงเวลา')+(g?' • ครูตรวจแล้ว':rec?' • ครูรับงานแล้ว รอตรวจ':' • ยังไม่ได้ส่งไฟล์ให้ครู'),c:g?'emerald':!rec?'yellow':late?'orange':'blue'}}

 <div><label class="lbl">ความเห็นครู</label><textarea id="g-fb" rows="2" class="inp">${esc(sb.feedback||'')}</textarea></div>
 <div><label class="lbl">ลายเซ็นครู</label><canvas id="sig" width="320" height="120" class="border-2 border-slate-800 rounded-xl bg-white touch-none"></canvas>
 <div class="flex flex-wrap gap-2 mt-1"><button onclick="sigClear()" class="b bg-slate-200 !py-1">ล้าง</button><button onclick="sigLoad(D.teacherSig)" class="b bg-purple-200 !py-1">ใช้ลายเซ็นที่บันทึกไว้</button><label class="text-xs font-bold flex items-center gap-1"><input type="checkbox" id="sig-keep"> บันทึกเป็นลายเซ็นประจำ</label></div></div></div>
 <div class="pt-4 flex gap-2"><button onclick="closeM()" class="b bg-slate-200 w-1/3">ปิด</button><button onclick="delSubT('${itemId}','${stId}')" class="b bg-red-200 w-1/3">ลบงาน</button><button onclick="saveGrade('${itemId}','${stId}')" class="b bg-emerald-300 w-1/3">บันทึก</button></div>`);
 sigInit(sb.signature)}
function sigInit(existing){const c=$('sig'),x=c.getContext('2d');SIG={c,x,d:false,dirty:false,data:existing||null};x.lineWidth=2;x.lineCap='round';x.strokeStyle='#1e293b';
 const pos=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
 c.onpointerdown=e=>{SIG.d=true;SIG.dirty=true;const[p,q]=pos(e);x.beginPath();x.moveTo(p,q);c.setPointerCapture(e.pointerId)};
 c.onpointermove=e=>{if(!SIG.d)return;const[p,q]=pos(e);x.lineTo(p,q);x.stroke()};c.onpointerup=()=>SIG.d=false;
 if(existing)sigLoad(existing,true)}
function sigLoad(d,keep){if(!d){notify('ยังไม่มีลายเซ็นที่บันทึกไว้');return}const img=new Image();img.onload=()=>{SIG.x.clearRect(0,0,SIG.c.width,SIG.c.height);SIG.x.drawImage(img,0,0,SIG.c.width,SIG.c.height);if(!keep)SIG.dirty=true};img.src=d}
function sigClear(){SIG.x.clearRect(0,0,SIG.c.width,SIG.c.height);SIG.dirty=true;SIG.data=null;SIG.cleared=true}
function saveGrade(itemId,stId){const it=D.items.find(i=>i.id===itemId),sb=D.subs[itemId+'|'+stId],v=$('g-score').value;
 if(v===''||+v<0||+v>it.max){notify('กรุณากรอกคะแนนระหว่าง 0 – '+it.max);return}
 sb.score=parseFloat(v);sb.feedback=$('g-fb').value.trim();if(SIG.dirty)sb.signature=SIG.cleared?'':SIG.c.toDataURL('image/png');
 if($('sig-keep').checked&&sb.signature)D.teacherSig=sb.signature;
 addNote(stId,`ครูตรวจ "${it.title}" แล้ว`,'graded');if(save()){closeM();renderAll()}}

function qHtml(q,i){let x='';
 if(q.type==='choice'||q.type==='multi')x=`<label class="lbl">ตัวเลือก (บรรทัดละ 1 ข้อ)</label><textarea class="inp" rows="4" oninput="QD.questions[${i}].opts=this.value.split('\\n')">${esc((q.opts||[]).join('\n'))}</textarea><label class="lbl mt-1">เฉลย (${q.type==='multi'?'เลขข้อ เช่น 1,3':'เลขข้อ เช่น 2'})</label><input class="inp" value="${esc(q.ans||'')}" oninput="QD.questions[${i}].ans=this.value">`;
 else if(q.type==='tf')x=`<label class="lbl">เฉลย</label><select class="inp" onchange="QD.questions[${i}].ans=this.value"><option value="T" ${q.ans==='T'?'selected':''}>ถูก</option><option value="F" ${q.ans==='F'?'selected':''}>ผิด</option></select>`;
 else if(q.type==='short')x=`<label class="lbl">คำตอบที่ถูก (คั่นหลายคำตอบด้วย |)</label><input class="inp" value="${esc(q.ans||'')}" oninput="QD.questions[${i}].ans=this.value">`;
 return `<div class="border-2 border-slate-800 rounded-2xl p-3 space-y-2 bg-slate-50"><div class="flex flex-wrap items-center gap-2"><b class="text-sm">ข้อ ${i+1}</b><select class="inp !w-auto" onchange="QD.questions[${i}].type=this.value;renderQE()">${Object.entries(QT).map(([k,v])=>`<option value="${k}" ${q.type===k?'selected':''}>${v}</option>`).join('')}</select><input type="number" min="0" step="0.5" class="inp !w-20" value="${q.pts}" oninput="QD.questions[${i}].pts=+this.value" title="คะแนน"><span class="text-xs">คะแนน</span><button onclick="QD.questions.splice(${i},1);renderQE()" class="b bg-red-200 !py-0.5 ml-auto">ลบข้อ</button></div>
 <textarea class="inp" rows="2" placeholder="โจทย์" oninput="QD.questions[${i}].text=this.value">${esc(q.text)}</textarea>
 <div><input type="file" accept="image/*" class="text-xs" onchange="readFiles(this.files).then(a=>{QD.questions[${i}].img=a[0]||null;renderQE()})">${q.img&&q.img.data?`<img src="${q.img.data}" class="h-20 mt-1 rounded-lg border-2 border-slate-800"> <button onclick="QD.questions[${i}].img=null;renderQE()" class="text-red-500 text-xs">ลบรูป</button>`:''}</div>${x}</div>`}
function addQ(t){QD.questions.push({id:uid('q'),type:t,text:'',pts:1,opts:t==='choice'||t==='multi'?['','','','']:[],ans:t==='tf'?'T':''});renderQE()}
function saveQuiz(){if(!QD.title.trim()){notify('กรุณากรอกชื่อแบบทดสอบ');return}if(!QD.questions.length){notify('ต้องมีอย่างน้อย 1 ข้อ');return}
 for(const[i,q]of QD.questions.entries()){if(!q.text.trim()){notify(`ข้อ ${i+1}: กรุณากรอกโจทย์`);return}
  if(q.type==='choice'||q.type==='multi'){q.opts=(q.opts||[]).map(o=>o.trim()).filter(Boolean);if(q.opts.length<2){notify(`ข้อ ${i+1}: ต้องมีอย่างน้อย 2 ตัวเลือก`);return}if(!q.ans.trim()){notify(`ข้อ ${i+1}: กรุณาระบุเฉลย`);return}}
  if(q.type==='short'&&!q.ans.trim()){notify(`ข้อ ${i+1}: กรุณาระบุคำตอบที่ถูก`);return}}
 const o={...QD};delete o._id;o.max=QD.questions.reduce((a,q)=>a+(+q.pts||0),0);
 if(QD._id){Object.assign(D.items.find(i=>i.id===QD._id),o)}else D.items.push({...o,id:uid('i'),kind:'quiz',subjectId:UI.subjectId});

 const f={name:$('sf-name').value.trim(),room:$('sf-room').value.trim(),no:$('sf-no').value.trim()},text=$('sf-text').value.trim(),errs=[];
 if(!f.name)errs.push('ยังไม่ได้กรอกชื่อ - นามสกุล');else if(nz(f.name)!==nz(st.name))errs.push('ชื่อ - นามสกุลไม่ตรงกับข้อมูลของคุณ');

 const old=D.subs[it.id+'|'+st.id],sb={text,files:SUB.files,fields:f,at:Date.now(),typed:SUB.typed,pasted:SUB.pasted,flags:[],score:undefined,feedback:'',signature:''};
 sb.flags=analyze(it,st,sb);D.subs[it.id+'|'+st.id]=sb;
 if(sb.flags.length)D.alerts.push({id:uid('a'),kind:'plag',stId:st.id,text:`${st.name} (${st.room}) ส่ง "${it.title}": ${sb.flags.join(' / ')}`,ts:Date.now(),read:false});

/* ----- similarity / copy check ----- */
const grams=t=>{t=t.toLowerCase().replace(/[\s\p{P}]+/gu,'');const s=new Set();for(let i=0;i+5<=t.length;i++)s.add(t.slice(i,i+5));return s};
const jac=(a,b)=>{if(a.size<15||b.size<15)return 0;let n=0;a.forEach(x=>{if(b.has(x))n++});return n/(a.size+b.size-n)};
const subText=s=>(s.text||'')+' '+(s.files||[]).map(fileText).join(' ');
function analyze(it,st,sb){const fl=new Set(),me=grams(subText(sb)),mine=(sb.files||[]).map(fh);
 Object.entries(D.subs).forEach(([k,o])=>{if(o===sb)return;const[iid,sid]=k.split('|');const other=D.students.find(x=>x.id===sid);
  if(iid===it.id&&sid!==st.id){const sim=jac(me,grams(subText(o)));
   if(sim>=0.5){fl.add(`เนื้อหาคล้ายงานของ ${other?other.name:sid} ${(sim*100).toFixed(0)}%`);(o.flags=o.flags||[]).includes(`เนื้อหาคล้ายงานของ ${st.name} ${(sim*100).toFixed(0)}%`)||o.flags.push(`เนื้อหาคล้ายงานของ ${st.name} ${(sim*100).toFixed(0)}%`)}
   if((o.files||[]).some(f=>mine.includes(fh(f)))){fl.add(`ไฟล์ซ้ำกับงานของ ${other?other.name:sid}`);const m=`ไฟล์ซ้ำกับงานของ ${st.name}`;o.flags=o.flags||[];if(!o.flags.includes(m))o.flags.push(m)}}
  else if(sid===st.id&&iid!==it.id&&(o.files||[]).some(f=>mine.includes(fh(f))))fl.add('ใช้ไฟล์เดิมซ้ำกับงานอื่นของตัวเอง')});
 if(sb.pasted>=200&&sb.pasted/(sb.typed+sb.pasted)>0.7)fl.add(`วางข้อความจำนวนมาก (${sb.pasted} ตัวอักษร จากที่พิมพ์เอง ${sb.typed}) — อาจคัดลอกมาจากเว็บ/แหล่งอื่น`);
 return[...fl]}

/* ----- quiz taking with anti-cheat ----- */
function startQuiz(itemId){const it=D.items.find(i=>i.id===itemId);
 showDlg(`เริ่มทำ "${it.title}"\n\n⚠️ กติกา: ระหว่างทำข้อสอบห้ามสลับแท็บ ออกจากหน้านี้ หรือเปิดเว็บ/แอปอื่น หากตรวจพบ ระบบจะ "ปิดการสอบทันที ตัดสินว่าทุจริต ได้ 0 คะแนน" และแจ้งครูทันที\nทำได้เพียงครั้งเดียว`,{btns:[{l:'ฉันเข้าใจ เริ่มสอบ',c:'bg-pink-300',f:()=>runQuiz(it)},{l:'ยกเลิก'}]})}
function runQuiz(it){const st=UI.student;QS={it,st,end:it.time?Date.now()+it.time*60000:0};const ov=$('quiz-overlay');ov.classList.remove('hidden');
 ov.innerHTML=`<div class="max-w-2xl mx-auto p-4 space-y-3 select-none"><div class="card p-3 sticky top-2 z-10 flex justify-between items-center bg-yellow-100"><b>${esc(it.title)}</b><span id="qtimer" class="font-black text-red-600"></span></div>
 ${it.desc?`<p class="text-sm">${esc(it.desc)}</p>`:''}<div>${chips(it.files)}</div>
 ${it.questions.map((q,i)=>`<div class="card p-4 space-y-2"><b>ข้อ ${i+1}. ${esc(q.text)} <span class="text-xs text-slate-500">(${q.pts} คะแนน)</span></b>${q.img&&q.img.data?`<img src="${q.img.data}" class="max-h-48 rounded-lg border-2 border-slate-800">`:''}
 ${q.type==='choice'?q.opts.map((o,j)=>`<label class="flex gap-2 text-sm"><input type="radio" name="q${i}" value="${j+1}">${esc(o)}</label>`).join(''):q.type==='multi'?q.opts.map((o,j)=>`<label class="flex gap-2 text-sm"><input type="checkbox" name="q${i}" value="${j+1}">${esc(o)}</label>`).join(''):q.type==='tf'?`<label class="flex gap-2 text-sm"><input type="radio" name="q${i}" value="T">ถูก</label><label class="flex gap-2 text-sm"><input type="radio" name="q${i}" value="F">ผิด</label>`:q.type==='short'?`<input class="inp" name="q${i}" autocomplete="off">`:`<textarea class="inp" rows="4" name="q${i}"></textarea>`}</div>`).join('')}
 <button onclick="finishQuiz()" class="b bg-emerald-300 w-full !py-3">ส่งแบบทดสอบ</button></div>`;
 QS.h={vis:()=>{if(document.hidden)cheat('สลับแท็บ/ออกจากหน้าต่างทำข้อสอบ')},blur:()=>cheat('เปลี่ยนหน้าต่าง/เปิดเว็บหรือแอปอื่นระหว่างสอบ'),block:e=>e.preventDefault()};
 document.addEventListener('visibilitychange',QS.h.vis);window.addEventListener('blur',QS.h.blur);['copy','cut','paste','contextmenu'].forEach(e=>ov.addEventListener(e,QS.h.block));
 const tick=()=>{if(!QS)return;if(QS.end){const l=Math.max(0,QS.end-Date.now());$('qtimer').textContent=`⏱ ${Math.floor(l/60000)}:${String(Math.floor(l/1000)%60).padStart(2,'0')}`;if(!l){finishQuiz(true);return}}QS.t=setTimeout(tick,500)};tick()}
function collect(){return QS.it.questions.map((q,i)=>{const els=[...document.getElementsByName('q'+i)];if(q.type==='multi')return els.filter(e=>e.checked).map(e=>e.value).join(',');if(q.type==='choice'||q.type==='tf'){const c=els.find(e=>e.checked);return c?c.value:''}return els[0]?els[0].value.trim():''})}
function stopQuiz(){clearTimeout(QS.t);document.removeEventListener('visibilitychange',QS.h.vis);window.removeEventListener('blur',QS.h.blur);const ov=$('quiz-overlay');['copy','cut','paste','contextmenu'].forEach(e=>ov.removeEventListener(e,QS.h.block))}
function finishQuiz(auto){if(!QS)return;const{it,st}=QS,ans=collect();
 if(!auto&&ans.some(a=>a==='')&&true){const un=ans.filter(a=>a==='').length;return showDlg(`ยังไม่ได้ตอบ ${un} ข้อ ต้องการส่งเลยหรือไม่?`,{btns:[{l:'ส่งเลย',c:'bg-pink-300',f:()=>doFinish(ans)},{l:'กลับไปทำต่อ'}]})}
 doFinish(ans)}
function gradeQuiz(it,ans){let sc=0,pend=false;it.questions.forEach((q,i)=>{const a=(ans[i]||'').trim();if(q.type==='essay'||q.ans==null){pend=true;return}let ok=false;
  if(q.type==='choice'||q.type==='tf')ok=a===q.ans.trim();else if(q.type==='multi')ok=a.split(',').filter(Boolean).sort().join(',')===q.ans.split(',').map(x=>x.trim()).filter(Boolean).sort().join(',');
  else ok=q.ans.split('|').some(x=>x.trim().toLowerCase()===a.toLowerCase());if(ok)sc+=+q.pts});return{sc,pend}}
function doFinish(ans){if(!QS)return;const{it,st}=QS,r=gradeQuiz(it,ans);D.attempts[it.id+'|'+st]={answers:ans,auto:r.sc,manual:0,essay:{},pending:r.pend,status:'done',at:Date.now()};stopQuiz();QS=null;save();$('quiz-overlay').classList.add('hidden');renderAll();afterSend('ส่งแบบทดสอบเรียบร้อยแล้ว')}
function afterSend(msg){if(!D.isStudentPack)return notify(msg);showDlg(msg+'\n\n📤 อย่าลืมสร้างไฟล์ส่งงานให้ครู',{btns:[{l:'สร้างไฟล์ส่งงานตอนนี้',c:'bg-blue-300',f:openOutbox},{l:'ไว้ทีหลัง'}]})}
function cheat(reason){if(!QS)return;const{it,st}=QS,stu=D.students.find(x=>x.id===st);let ans=[];try{ans=collect()}catch(e){}stopQuiz();QS=null;
 D.attempts[it.id+'|'+st]={answers:ans,auto:0,manual:0,essay:{},status:'cheated',reason,at:Date.now()};
 D.alerts.push({id:uid('a'),kind:'cheat',stId:st,text:`ทุจริตการสอบ: ${stu.name} (${stu.room} เลขที่ ${stu.no}) ใน "${it.title}" — ${reason} → ตัดสิทธิ์ 0 คะแนน`,ts:Date.now(),read:false});
 addNote(st,`ระบบตรวจพบการทุจริตใน "${it.title}": ${reason} — ปิดการสอบและตัดสิทธิ์ (0 คะแนน)`,'cheat');save();
 $('quiz-overlay').innerHTML=`<div class="min-h-screen flex items-center justify-center p-6"><div class="card bg-red-100 p-6 max-w-md text-center space-y-3"><div class="text-6xl">🚨</div><h2 class="text-2xl font-extrabold text-red-700">ปิดการทำข้อสอบ — ตรวจพบการทุจริต</h2><p class="text-sm font-bold">${esc(reason)}</p><p class="text-sm">ระบบได้บันทึกผลเป็น "ทุจริต ได้ 0 คะแนน" และแจ้งครูผู้สอนแล้ว</p><button onclick="$('quiz-overlay').classList.add('hidden');renderAll()" class="b bg-white w-full">กลับหน้าหลัก</button></div></div>`}

/* ----- no-account transfer (pack / bundle) ----- */
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec=t=>{t=String(t).trim();try{return JSON.parse(t)}catch(e){return JSON.parse(decodeURIComponent(escape(atob(t))))}};
function showCode(title,hint,obj,fname){window.__obj=obj;window.__fn=fname;
 openM(`<h3 class="text-xl font-extrabold pr-8">${title}</h3><p class="text-xs font-bold text-slate-600 my-2 whitespace-pre-line">${hint}</p><textarea id="codebox" readonly rows="5" class="inp font-mono text-[10px]">${enc(obj)}</textarea><div class="pt-3 flex gap-2"><button class="b bg-yellow-200 w-1/2" onclick="copyCode()">คัดลอกรหัส</button><button class="b bg-emerald-300 w-1/2" onclick="saveFile(window.__fn,JSON.stringify(window.__obj))">ดาวน์โหลดไฟล์</button></div>`)}
function copyCode(){const t=$('codebox');t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}toast(ok?'คัดลอกรหัสแล้ว':'กดค้างที่ช่องข้อความแล้วเลือก "คัดลอก"')}
function buildPack(){const stat={};
 Object.entries(D.subs).forEach(([k,x])=>{const sid=k.split('|')[1];(stat[sid]=stat[sid]||{})[k]={g:typeof x.score==='number'}});
 Object.keys(D.attempts).forEach(k=>{const sid=k.split('|')[1];(stat[sid]=stat[sid]||{})[k]={g:true}});
 return{type:'pack',v:Date.now(),years:D.years,terms:D.terms,rooms:D.rooms,subjects:D.subjects,students:D.students,
  items:D.items.map(i=>i.questions?{...i,questions:i.questions.map(q=>{const{ans,...r}=q;return r})}:i),stat,notes:D.notes}}
function openPack(){showCode('ชุดห้องเรียนสำหรับนักเรียน','ส่งไฟล์หรือรหัสนี้ให้นักเรียน (เฉลยข้อสอบและคะแนนไม่ถูกรวมไว้)\nนักเรียนนำเข้าที่: มุมนักเรียน → นำเข้าห้องเรียนจากครู',buildPack(),'ห้องเรียน_'+(subj()?.code||'class')+'.json')}
function openImportPack(){openM(`<h3 class="text-xl font-extrabold pr-8">นำเข้าห้องเรียนจากครู</h3><p class="text-xs text-slate-600 my-2">เลือกไฟล์ที่ครูส่งให้ หรือวางรหัสด้านล่าง</p><input type="file" id="pf" accept=".json,.txt" class="text-xs"><textarea id="pt" rows="4" class="inp mt-2 text-[10px] font-mono" placeholder="วางรหัสห้องเรียนที่นี่"></textarea><div class="pt-3"><button onclick="runImportPack()" class="b bg-emerald-300 w-full">นำเข้า</button></div>`)}
async function runImportPack(){let t=$('pt').value;const f=$('pf').files[0];if(f)t=await f.text();if(!t.trim()){notify('กรุณาเลือกไฟล์หรือวางรหัส');return}
 let p;try{p=dec(t)}catch(e){notify('ไฟล์/รหัสไม่ถูกต้อง');return}
 if(!p||p.type!=='pack'){notify('นี่ไม่ใช่ไฟล์ห้องเรียนจากครู');return}
 if(!D.isStudentPack&&(Object.keys(D.subs).length||Object.keys(D.attempts).length)){notify('เครื่องนี้มีข้อมูลงานของครูอยู่ การนำเข้าจะลบข้อมูลทั้งหมด กรุณานำเข้าบนเครื่องของนักเรียนเท่านั้น');return}
 const keep=D.isStudentPack?{subs:D.subs,attempts:D.attempts,notes:D.notes}:{subs:{},attempts:{},notes:[]},old=new Map(keep.notes.map(n=>[n.id,n]));
 const notes=(p.notes||[]).map(n=>old.has(n.id)?old.get(n.id):n);
 D={...seed(),years:p.years,terms:p.terms,rooms:p.rooms,subjects:p.subjects,students:p.students,items:p.items,stat:p.stat||{},notes,subs:keep.subs,attempts:keep.attempts,scores:{},alerts:[],att:{},teacherSig:'',isStudentPack:true};
 save();closeM();UI.student=null;UI.subjectId=null;renderAll();notify('นำเข้าห้องเรียนเรียบร้อยแล้ว เข้าสู่ระบบนักเรียนได้เลย')}
function buildBundle(){const st=D.students.find(x=>x.id===UI.student),subs={},attempts={};
 Object.entries(D.subs).forEach(([k,x])=>{if(k.endsWith('|'+st.id))subs[k]=x});Object.entries(D.attempts).forEach(([k,x])=>{if(k.endsWith('|'+st.id))attempts[k]=x});
 return{type:'bundle',at:Date.now(),student:{id:st.id,no:st.no,name:st.name,room:st.room},subs,attempts}}
function outboxCard(st){const n=Object.keys(D.subs).concat(Object.keys(D.attempts)).filter(k=>k.endsWith('|'+st.id)).length;
 return `<div class="card p-3 bg-blue-50 flex flex-wrap items-center justify-between gap-2"><div class="text-xs font-bold">📤 งานที่ทำบนเครื่องนี้ ต้องส่งไฟล์ให้ครูด้วยตนเอง<br><span class="font-normal text-slate-600">ไม่ต้องมีบัญชี — ส่งไฟล์ทาง Facebook/อีเมล/ให้ครูโดยตรง</span></div><div class="flex gap-2"><button onclick="openOutbox()" class="b bg-blue-300">สร้างไฟล์ส่งงาน (${n})</button><button onclick="openImportPack()" class="b bg-yellow-200">อัปเดตสถานะ</button></div></div>`}
function openOutbox(){if(!UI.student)return;const b=buildBundle();if(!Object.keys(b.subs).length&&!Object.keys(b.attempts).length){notify('ยังไม่มีงานที่ส่งบนเครื่องนี้');return}
 showCode('ไฟล์ส่งงานให้ครู','ดาวน์โหลดไฟล์ แล้วส่งให้ครู (Facebook/อีเมล) หรือกดคัดลอกรหัสไปส่งแทนก็ได้\nหากแก้ไขงานภายหลัง ให้สร้างไฟล์ส่งงานใหม่อีกครั้ง',b,'ส่งงาน_'+b.student.id+'.json')}
function openImportBundles(){openM(`<h3 class="text-xl font-extrabold pr-8">นำเข้างานที่นักเรียนส่ง</h3><p class="text-xs text-slate-600 my-2">เลือกไฟล์ส่งงานของนักเรียน (เลือกได้หลายไฟล์พร้อมกัน) หรือวางรหัสที่นักเรียนส่งมา</p><input type="file" id="bf" multiple accept=".json,.txt" class="text-xs"><textarea id="bt" rows="4" class="inp mt-2 text-[10px] font-mono" placeholder="หรือวางรหัสของนักเรียนที่นี่ (1 คนต่อครั้ง)"></textarea><div class="pt-3"><button onclick="runImportBundles()" class="b bg-emerald-300 w-full">นำเข้า</button></div>`)}
async function runImportBundles(){const texts=[];for(const f of $('bf').files)texts.push(await f.text());if($('bt').value.trim())texts.push($('bt').value);
 if(!texts.length){notify('กรุณาเลือกไฟล์หรือวางรหัสก่อน');return}
 let ok=0,added=0;const skip=[];
 texts.forEach(t=>{let b;try{b=dec(t)}catch(e){skip.push('ไฟล์ที่อ่านไม่ได้');return}
  if(!b||b.type!=='bundle'||!b.student){skip.push('ไม่ใช่ไฟล์ส่งงาน');return}
  const st=D.students.find(x=>x.id===b.student.id);if(!st||nz(st.name)!==nz(b.student.name)){skip.push('ไม่พบนักเรียน '+(b.student.name||''));return}
  Object.entries(b.subs||{}).forEach(([k,x])=>{const[iid,sid]=k.split('|');if(sid!==st.id)return;const it=D.items.find(i=>i.id===iid);if(!it)return;
   const o=D.subs[k];if(o&&(o.at>=x.at||typeof o.score==='number'))return;
   x.score=undefined;x.feedback='';x.signature='';x.flags=[];D.subs[k]=x;x.flags=analyze(it,st,x);added++;
   if(x.flags.length)D.alerts.push({id:uid('a'),kind:'plag',stId:st.id,text:`${st.name} (${st.room}) ส่ง "${it.title}": ${x.flags.join(' / ')}`,ts:Date.now(),read:false})});
  Object.entries(b.attempts||{}).forEach(([k,a])=>{const[iid,sid]=k.split('|');if(sid!==st.id||D.attempts[k])return;const it=D.items.find(i=>i.id===iid);if(!it||it.kind!=='quiz')return;
   if(a.status==='cheated')D.alerts.push({id:uid('a'),kind:'cheat',stId:st.id,text:`ทุจริตการสอบ: ${st.name} (${st.room} เลขที่ ${st.no}) ใน "${it.title}" — ${a.reason} → ตัดสิทธิ์ 0 คะแนน`,ts:Date.now(),read:false});
   else{const r=gradeQuiz(it,a.answers||[]);a.auto=r.sc;a.pending=r.pend;a.manual=0;a.essay={}}
   D.attempts[k]=a;added++});ok++});
 save();closeM();renderAll();notify(`นำเข้าสำเร็จ ${ok} ไฟล์ (งาน/แบบทดสอบใหม่ ${added} รายการ)`+(skip.length?'\nข้าม: '+skip.join(', '):''))}
</script>
