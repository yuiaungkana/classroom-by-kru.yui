<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<body style="font:14px sans-serif;padding:12px"><pre id="o" style="white-space:pre-wrap">กำลังตรวจ...</pre>
<script>
fetch('index.html?'+Date.now()).then(r=>r.text()).then(t=>{
 const m=/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/.exec(t);
 const L=m[1].split('\n'),res=[];
 let acc='',names=[];
 for(let i=0;i<L.length;i++){
  const mm=/^(?:async\s+)?function\s+(\w+)\s*\(/.exec(L[i]);
  if(mm&&acc){names.push(mm[1])}
  acc+=L[i]+'\n'}
 // นับปีกกาสะสม ณ จุดเริ่มแต่ละฟังก์ชันระดับบนสุด
 let depth=0,inS=null,esc=false,line=0,bad=[];
 const s=m[1];
 for(let i=0;i<s.length;i++){
  const c=s[i];
  if(c==='\n')line++;
  if(inS){if(esc)esc=false;else if(c==='\\')esc=true;else if(c===inS)inS=null;continue}
  if(c==="'"||c==='"'||c==='`'){inS=c;continue}
  if(c==='/'&&s[i+1]==='/'){while(i<s.length&&s[i]!=='\n')i++;line++;continue}
  if(c==='{')depth++;if(c==='}')depth--;
  if(c==='\n'){const nx=s.slice(i+1,i+60);if(/^(?:async\s+)?function\s+\w+/.test(nx)&&depth!==0)bad.push('ก่อนฟังก์ชันที่บรรทัดสคริปต์ '+(line+1)+': '+nx.split('\n')[0].slice(0,50)+' (ปีกกาค้าง '+depth+')')}
 }
 o.textContent=bad.length?bad.slice(0,6).join('\n'):'ไม่พบฟังก์ชันที่เริ่มตอนที่ปีกกายังค้าง (ปีกกาท้ายสุดค้าง '+depth+')'
}).catch(e=>o.textContent='ERR '+e);
</script></body>
