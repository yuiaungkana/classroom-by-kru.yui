<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classroom LMS – Chibi Pastel</title>
<!-- Backend: Apps Script (Code.gs) — ใส่ URL ที่ตัวแปร GAS_URL ในสคริปต์ -->
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{font-family:'Prompt',sans-serif;background:linear-gradient(135deg,#fdf4ff,#f0f9ff 50%,#f0fdf4);min-height:100vh;color:#334155}
.mali{font-family:'Mali','Prompt',cursive}
.bb{transition:all .25s cubic-bezier(.68,-.55,.27,1.55);box-shadow:0 5px 0 rgba(0,0,0,.08)}
.bb:hover{transform:translateY(-2px) scale(1.02)}.bb:active{transform:translateY(2px) scale(.98);box-shadow:0 1px 0 rgba(0,0,0,.08)}
.card{border-radius:1.5rem;background:#fff;box-shadow:0 10px 25px -5px rgba(244,114,182,.12)}
.nav-on{background:#fbcfe8;color:#9d174d}
input,textarea,select{outline:none}input:focus,textarea:focus,select:focus{border-color:#f472b6}
</style>
</head>
<body class="antialiased">
<div class="bg-pink-200/90 text-[11px] font-bold py-1 text-center">💾 <span id="st">บันทึกอัตโนมัติในเบราว์เซอร์</span></div>
<header class="bg-white/80 backdrop-blur border-b-4 border-pink-200 sticky top-0 z-30">
 <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
  <div class="flex items-center gap-2"><span class="text-3xl">🐥</span><div><b class="mali text-lg leading-none block">Classroom LMS</b><span id="hs" class="text-[10px] text-slate-500"></span></div></div>
  <div class="flex items-center gap-2">
   <div class="relative"><button onclick="$('nd').classList.toggle('hidden')" class="bb bg-white border-2 border-pink-200 rounded-2xl px-3 py-1.5 text-sm relative">🔔<span id="nb" class="hidden absolute -top-1 -right-1 bg-rose-500 text-white rounded-full text-[9px] w-4 h-4 flex items-center justify-center"></span></button>
    <div id="nd" class="hidden absolute right-0 mt-2 w-72 card border-2 border-pink-200 p-3 text-xs z-50"><div class="flex justify-between font-bold mb-2"><span>การแจ้งเตือน</span><button onclick="seen=Date.now();try{localStorage.setItem('lms_seen',seen)}catch(e){}render()" class="text-slate-400">ล้าง</button></div><div id="nl" class="space-y-2 max-h-60 overflow-y-auto"></div></div></div>
   <div class="bg-slate-100 p-1 rounded-2xl flex text-xs font-bold"><button id="r-teacher" onclick="setRole('teacher')" class="px-3 py-1.5 rounded-xl">👩‍🏫 ครู</button><button id="r-student" onclick="setRole('student')" class="px-3 py-1.5 rounded-xl">🎓 นักเรียน</button></div>
  </div>
 </div>
</header>
<div class="max-w-6xl mx-auto px-4 py-5 flex flex-col md:flex-row gap-5">
 <aside class="md:w-56 shrink-0"><div class="card border-2 border-pink-100 p-3 md:sticky md:top-24">
  <div id="who" class="p-3 rounded-2xl bg-pink-50 mb-3 text-xs"></div>
  <nav id="nav" class="flex md:block gap-1 overflow-x-auto"></nav></div></aside>
 <main id="view" class="flex-1 min-w-0 space-y-4"></main>
</div>
<div id="modal" class="hidden fixed inset-0 bg-slate-900/50 z-50 flex items-center justify-center p-4"></div>
<div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs font-bold px-4 py-2 rounded-2xl z-[60]"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K='CLASSROOM_LMS_V2';
let S={
 items:[
  {id:'m1',type:'material',title:'บทที่ 1: การเขียนโปรแกรมเบื้องต้น',desc:'ใบความรู้ตัวแปรและฟังก์ชัน',url:''},
  {id:'e1',type:'exercise',title:'แบบฝึกหัดที่ 1: การประกาศตัวแปร',desc:'เขียนโค้ดคำนวณพื้นที่สามเหลี่ยม',max:10,due:'2026-11-15T23:59'},
  {id:'t1',type:'test',title:'แบบทดสอบย่อย บทที่ 1',desc:'ปรนัย (จับเวลา)',max:10,time:15,questions:[{q:'ข้อใดคือชนิดข้อมูลจำนวนเต็มใน Python?',opts:['int','float','str','bool'],ans:'int'},{q:'คำสั่งแสดงผลใน Python คือข้อใด?',opts:['echo','print','show','out'],ans:'print'}]},
  {id:'p1',type:'project',title:'โครงงานที่ 1: เกม Scratch',desc:'ส่งลิงก์ผลงาน Scratch',max:20,due:'2026-11-20T23:59'}],
 students:[{id:'s1',code:'6601',no:1,name:'นายสมชาย ใจดี'},{id:'s2',code:'6602',no:2,name:'นางสาวสมหญิง รักเรียน'},{id:'s3',code:'6603',no:3,name:'เด็กชายมานพ รักเรียน'}],
 subs:{},notifs:[]};
let role='teacher',me=null,tab='dashboard',timer=null,activeTest=null;
try{const d=JSON.parse(localStorage.getItem(K)||'null');if(d&&d.items)S=d}catch(e){}
S.cfg={term:'1',year:'2569',room:'ม.4/1',scode:'',sname:'คอมพิวเตอร์',pw:'',...S.cfg};
let DB=null,canEdit=true,seen=0;try{seen=+localStorage.getItem('lms_seen')||0}catch(e){}
/* ===== ตั้งค่า: วาง Web app URL จาก Apps Script ตรงนี้ ===== */
const GAS_URL='https://script.google.com/macros/s/AKfycbwRRYb2s-4YhpuWOTi_kc1Nd7p8uoB799LRxzZVQiJ8k26UpxoPotuftk0aTGYR2fqu/execนี่';
const G=()=>/^https:\/\//.test(GAS_URL);
let TKEY='',authed=false,saveTimer=null;
async function gas(b){const r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...b,key:TKEY})});return r.json()}
async function gasUpload(f){
 if(f.size>15*1048576)throw new Error('big');
 const d=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(f)});
 const x=await gas({action:'upload',name:f.name,type:f.type||'application/octet-stream',data:d});
 if(!x.ok)throw new Error(x.error);return{url:x.url,contentType:f.type,id:x.id,dl:x.dl}}
const use=async n=>n==='assets'&&G()?{upload:gasUpload}:n==='downloads'?{save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type:'application/json'}));a.download=filename;a.click()}}:null;
const busy=()=>/INPUT|TEXTAREA/.test(document.activeElement?.tagName||'')&&$('view').contains(document.activeElement);
const qt=q=>q.type||'mc',pts=(q,it)=>q.pts??Math.round(it.max/it.questions.length*10)/10;
const ok=(q,a)=>qt(q)==='mc'?a===q.ans:qt(q)==='fill'&&String(q.ans).split('|').some(x=>x.trim().toLowerCase()===a.toLowerCase());
const notifs=()=>{const r=[];Object.entries(S.subs).forEach(([i,o])=>Object.entries(o).forEach(([d,x])=>{const t=Date.parse(x.at);if(t>seen&&['submitted','cheated'].includes(x.status)){const it=S.items.find(k=>k.id===i),st=S.students.find(k=>k.id===d);r.push({t:(x.status==='cheated'?'🚨 ถูกตัดสิทธิ์: ':'ส่งงาน: ')+(st?.name||d)+' – '+(it?.title||''),time:new Date(t).toLocaleTimeString('th-TH'),k:t})}}));return r.sort((a,b)=>b.k-a.k).slice(0,30)};
const TY={material:{n:'สื่อการเรียน',e:'📖',c:'sky'},exercise:{n:'แบบฝึกหัด',e:'✏️',c:'pink'},test:{n:'แบบทดสอบ',e:'📝',c:'purple'},project:{n:'ชิ้นงาน/โครงงาน',e:'🧩',c:'emerald'}};
const tasks=()=>S.items.filter(i=>i.type!=='material');
const sub=(i,s)=>(S.subs[i]||{})[s];
const tm=()=>new Date().toLocaleTimeString('th-TH');
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
 if(G()&&authed&&role==='teacher'){clearTimeout(saveTimer);$('st').textContent='⏳ กำลังบันทึก...';
  saveTimer=setTimeout(async()=>{saveTimer=null;try{const x=await gas({action:'saveCore',core:{cfg:S.cfg,items:S.items,students:S.students}});$('st').textContent=x.ok?'☁️ บันทึกลง Google Drive แล้ว '+tm():'⚠️ '+(x.error||'บันทึกไม่สำเร็จ')}catch(e){$('st').textContent='⚠️ บันทึกลง Drive ไม่สำเร็จ (เก็บในเครื่องแล้ว)'}},600)}
 else $('st').textContent='บันทึกในเครื่องแล้ว '+tm()}
function putSub(i,d){if(!G())return;gas({action:'putSub',iid:i,sid:d,sub:S.subs[i][d]}).then(x=>{$('st').textContent=x.ok?'☁️ ส่งข้อมูลแล้ว '+tm():'⚠️ '+(x.error||'ไม่สำเร็จ');if(x.ok&&x.sub&&S.subs[i]&&S.subs[i][d]){S.subs[i][d]=x.sub;render();if(x.sub.answers&&role==='student')toast(x.sub.status==='graded'?'ส่งแล้ว ได้ '+x.sub.score+' คะแนน':'ส่งแล้ว รอครูตรวจข้อเขียน')}if(!x.ok)toast(x.error||'ส่งข้อมูลไม่สำเร็จ')},()=>toast('ส่งข้อมูลไม่สำเร็จ ตรวจอินเทอร์เน็ต'))}
async function pull(first){
 if(!G())return;
 try{const r=await(await fetch(GAS_URL+'?action=getAll&key='+encodeURIComponent(TKEY)+'&sid='+encodeURIComponent(me?me.id:''))).json();
  if(r.core&&!saveTimer){S.cfg={...S.cfg,...r.core.cfg};S.items=r.core.items||[];S.students=r.core.students||[]}
  else if(!r.core&&authed&&role==='teacher')save();
  S.subs=r.subs||{};
  if(first||(!busy()&&$('modal').classList.contains('hidden')))render();
  $('st').textContent='☁️ ซิงค์กับ Google Drive '+tm()}
 catch(e){$('st').textContent='⚠️ เชื่อมต่อ Drive ไม่ได้ (ใช้ข้อมูลในเครื่อง)'}}
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add('hidden'),2500)}
function notify(t){S.notifs.unshift({t,time:new Date().toLocaleTimeString('th-TH')})}
function setRole(r){
 if(r==='teacher'&&G()&&!authed){openForm('🔑 รหัสผ่านครู',[['k','รหัสผ่านครู','']],async v=>{TKEY=v.k;const x=await gas({action:'auth'}).catch(()=>null);if(!x||!x.ok){TKEY='';return toast('รหัสผ่านไม่ถูกต้อง')}authed=true;try{localStorage.setItem('lms_key',TKEY)}catch(e){}setRole('teacher');return true});return}
 role=r;if(r==='student'&&!me){openForm('🎓 เข้าสู่ระบบนักเรียน',[['code','รหัสประจำตัว นร.',''],['pw','รหัสผ่านห้องเรียน (ถ้ามี)','']],v=>{const f=S.students.find(x=>x.code===v.code);if(!f)return toast('ไม่พบรหัสนี้ในรายชื่อ');if(S.cfg.pw&&v.pw!==S.cfg.pw)return toast('รหัสผ่านห้องไม่ถูกต้อง');me=f;pull(true);render();return true},()=>{role=canEdit?'teacher':'student';render()});}
 if(['students','grades','room'].includes(tab)&&r==='student')tab='dashboard';render()}
function go(t){tab=t;render()}

/* modal form */
function openForm(title,fields,cb,onCancel){
 const ic='w-full border-2 border-slate-200 rounded-xl p-2 mt-1 font-normal';
 $('modal').innerHTML=`<div class="card border-4 border-pink-200 p-5 w-full max-w-sm space-y-3 max-h-[90vh] overflow-y-auto"><h3 class="mali font-bold text-lg">${title}</h3>${fields.map(([k,l,v,t,x])=>`<label class="block text-xs font-bold">${l}${t==='area'?`<textarea id="f_${k}" rows="4" class="${ic}">${esc(v)}</textarea>`:t==='dt'?`<input id="f_${k}" type="datetime-local" value="${esc(v)}" class="${ic}">`:t==='file'?`<input id="f_${k}" type="file" ${x?`accept="${x}"`:''} class="w-full text-xs mt-1 font-normal">`:`<input id="f_${k}" value="${esc(v)}" class="${ic}">`}</label>`).join('')}<div class="flex gap-2"><button id="fc" class="bb flex-1 py-2 rounded-xl bg-slate-100 text-xs font-bold">ยกเลิก</button><button id="fo" class="bb flex-1 py-2 rounded-xl bg-pink-400 text-white text-xs font-bold">ตกลง</button></div></div>`;
 $('modal').classList.remove('hidden');
 $('fc').onclick=()=>{closeModal();onCancel&&onCancel()};
 $('fo').onclick=async()=>{const v={};fields.forEach(([k,,,t])=>v[k]=t==='file'?$('f_'+k).files[0]:$('f_'+k).value.trim());if(await cb(v))closeModal()};
}
function closeModal(){$('modal').classList.add('hidden');$('modal').innerHTML=''}

/* views */
function render(){
 const N=role==='teacher'?notifs():[];const c=S.cfg;$('hs').textContent=`${c.sname} ${c.scode} • ${c.room} • ภาคเรียน ${c.term}/${c.year}`;$('r-teacher').classList.toggle('hidden',!canEdit);
 const nav=[['dashboard','📊','ภาพรวม'],['room','🏫','ห้องเรียน',1],['students','👥','รายชื่อ',1],['material','📖','สื่อ'],['exercise','✏️','แบบฝึกหัด'],['test','📝','แบบทดสอบ'],['project','🧩','ชิ้นงาน'],['grades','🏅','ผลการเรียน',1]];
 $('nav').innerHTML=nav.filter(n=>!n[3]||role==='teacher').map(n=>`<button onclick="go('${n[0]}')" class="bb shrink-0 w-auto md:w-full text-left flex items-center gap-2 px-3 py-2.5 rounded-2xl text-xs font-bold mb-1 ${tab===n[0]?'nav-on':'hover:bg-pink-50'}">${n[1]} ${n[2]}</button>`).join('');
 $('r-teacher').className='px-3 py-1.5 rounded-xl '+(role==='teacher'?'bg-pink-400 text-white':'');
 $('r-student').className='px-3 py-1.5 rounded-xl '+(role==='student'?'bg-pink-400 text-white':'');
 $('who').innerHTML=role==='teacher'?'<b>👩‍🏫 คุณครูผู้สอน</b><br><span class="text-slate-500">โหมดจัดการห้องเรียน</span>':`<b>🎓 ${esc(me?.name||'ยังไม่เข้าสู่ระบบ')}</b><br><span class="text-slate-500">เลขที่ ${me?.no||'-'}</span>`;
 $('nb').classList.toggle('hidden',!N.length);$('nb').textContent=N.length;
 $('nl').innerHTML=N.map(n=>`<div class="p-2 bg-slate-50 rounded-xl">${esc(n.t)}<div class="text-[9px] text-slate-400">${n.time}</div></div>`).join('')||'<div class="text-center text-slate-400 py-3">ไม่มีการแจ้งเตือน</div>';
 $('view').innerHTML=tab==='dashboard'?vDash():tab==='students'?vStudents():tab==='grades'?vGrades():tab==='room'?vRoom():vList(tab);
}
const head=(t,d,btn)=>`<div class="flex justify-between items-center gap-2"><div><h1 class="mali font-bold text-xl">${t}</h1><p class="text-xs text-slate-500">${d}</p></div>${btn||''}</div>`;
const add=(f,l)=>role==='teacher'?`<button onclick="${f}" class="bb bg-pink-400 text-white px-4 py-2 rounded-2xl text-xs font-bold shrink-0">${l}</button>`:'';
function badge(s,i){
 if(!s)return'<span class="px-2 py-0.5 rounded-lg bg-rose-100 text-rose-600 text-[10px] font-bold">ยังไม่ส่ง</span>';
 if(s.status==='cheated')return'<span class="px-2 py-0.5 rounded-lg bg-rose-200 text-rose-700 text-[10px] font-bold">ตัดสิทธิ์</span>';
 if(s.status==='graded'&&(role==='teacher'||i.type==='test'))return`<span class="px-2 py-0.5 rounded-lg bg-emerald-100 text-emerald-700 text-[10px] font-bold">ตรวจแล้ว ${s.score}/${i.max}</span>`;
 if(s.status==='revision')return'<span class="px-2 py-0.5 rounded-lg bg-orange-100 text-orange-700 text-[10px] font-bold">แก้ไข</span>';
 return s.late?'<span class="px-2 py-0.5 rounded-lg bg-amber-100 text-amber-700 text-[10px] font-bold">ส่งช้า</span>':`<span class="px-2 py-0.5 rounded-lg bg-sky-100 text-sky-700 text-[10px] font-bold">${i.type==='test'?'ส่งแล้ว':'ตรงเวลา'}</span>`}
function vDash(){
 const T=tasks();let ok=0,late=0,miss=0;
 S.students.forEach(s=>T.forEach(t=>{const x=sub(t.id,s.id);if(!x||x.status==='cheated')miss++;else if(x.late)late++;else ok++}));
 const box=(e,l,n,c)=>`<div class="card p-4 flex items-center gap-3 border-2 border-${c}-200"><span class="text-2xl">${e}</span><div><div class="text-[11px] text-slate-500 font-bold">${l}</div><div class="text-xl font-bold">${n}</div></div></div>`;
 const rows=(role==='teacher'?S.students:S.students.filter(s=>s.id===me?.id));
 return head('ติดตามสถานะการส่งงาน','ภาพรวมการส่งงานของนักเรียน')+`<div class="grid grid-cols-2 lg:grid-cols-4 gap-3">${box('📋','งานทั้งหมด',S.students.length*T.length,'sky')}${box('✅','ตรงเวลา',ok,'emerald')}${box('⏰','ส่งล่าช้า',late,'yellow')}${box('🚨','ยังไม่ส่ง',miss,'pink')}</div>
 <div class="card overflow-x-auto"><table class="w-full text-xs text-left"><thead class="bg-pink-50 font-bold"><tr><th class="p-3">เลขที่</th><th class="p-3">ชื่อ-นามสกุล</th>${T.map(t=>`<th class="p-3 text-center">${esc(t.title.split(':')[0])}</th>`).join('')}</tr></thead><tbody class="divide-y">${rows.map(s=>`<tr><td class="p-3 font-bold">${s.no}</td><td class="p-3">${esc(s.name)}</td>${T.map(t=>`<td class="p-3 text-center">${badge(sub(t.id,s.id),t)}</td>`).join('')}</tr>`).join('')||'<tr><td class="p-4 text-slate-400" colspan="9">เข้าสู่ระบบนักเรียนเพื่อดูสถานะ</td></tr>'}</tbody></table></div>`}
function vStudents(){
 return head('จัดการรายชื่อนักเรียน','เพิ่ม แก้ไข หรือลบรายชื่อ',`<div class="flex gap-2">${add('importStudents()','📥 นำเข้า')}${add('addStudent()','+ เพิ่ม')}</div>`)+`<div class="card overflow-x-auto"><table class="w-full text-xs text-left"><thead class="bg-purple-50 font-bold"><tr><th class="p-3">เลขที่</th><th class="p-3">รหัส</th><th class="p-3">ชื่อ-นามสกุล</th><th class="p-3 text-center">จัดการ</th></tr></thead><tbody class="divide-y">${S.students.map(s=>`<tr><td class="p-3 font-bold">${s.no}</td><td class="p-3">${esc(s.code)}</td><td class="p-3">${esc(s.name)}</td><td class="p-3 text-center"><button onclick="editStudent('${s.id}')" class="mr-2">✏️</button><button onclick="delStudent('${s.id}')">🗑️</button></td></tr>`).join('')}</tbody></table></div>`}
function addStudent(){openForm('เพิ่มนักเรียน',[['name','ชื่อ-นามสกุล',''],['code','รหัสประจำตัว','']],v=>{if(!v.name||!v.code)return toast('กรอกให้ครบ');S.students.push({id:'s'+Date.now(),code:v.code,no:S.students.length+1,name:v.name});save();render();return true})}
function editStudent(id){const s=S.students.find(x=>x.id===id);openForm('แก้ไขนักเรียน',[['name','ชื่อ-นามสกุล',s.name],['code','รหัสประจำตัว',s.code]],v=>{if(!v.name)return;s.name=v.name;s.code=v.code;save();render();return true})}
function delStudent(id){openForm('ลบนักเรียนนี้?',[],()=>{S.students=S.students.filter(s=>s.id!==id);save();render();return true})}

function vList(type){
 const T=TY[type],list=S.items.filter(i=>i.type===type);

async function send(id){

async function shrink(f){if(!f||!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size<300000)return f;try{const b=await createImageBitmap(f),k=Math.min(1,1600/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);const o=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));return o&&o.size<f.size?new File([o],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):f}catch(e){return f}}
async function loadUsage(){const el=$('usage');if(!el)return;
 el.innerHTML=`<b>☁️ สำรองและกู้คืนข้อมูล</b><div class="text-slate-500">ข้อมูลและไฟล์แนบเก็บในโฟลเดอร์ Google Drive ที่ตั้งไว้ และซิงค์ทุกเครื่องอัตโนมัติ${G()?'':'<br><b class="text-rose-600">ยังไม่ได้ตั้งค่า GAS_URL ใน index.html — ตอนนี้เก็บในเครื่องนี้เท่านั้น</b>'}</div><div class="flex flex-wrap gap-2"><button onclick="backupDrive()" class="bb px-3 py-1.5 bg-sky-100 rounded-xl font-bold">☁️ สำรองลง Drive ตอนนี้</button><button onclick="backup()" class="bb px-3 py-1.5 bg-emerald-100 rounded-xl font-bold">📦 ดาวน์โหลดสำรอง (JSON)</button><button onclick="restore()" class="bb px-3 py-1.5 bg-amber-100 rounded-xl font-bold">♻️ กู้คืนจากไฟล์ JSON</button></div>`}

function importStudents(){openForm('📥 นำเข้ารายชื่อ',[['txt','วาง: เลขที่ รหัส ชื่อ-สกุล (บรรทัดละคน คั่นด้วย Tab หรือ ,)','','area'],['file','หรือเลือกไฟล์ CSV/TXT','','file','.csv,.txt']],async v=>{

 if(!n)return toast('ไม่พบข้อมูลที่อ่านได้');S.students.sort((a,b)=>a.no-b.no);save();render();toast('นำเข้า '+n+' รายชื่อ');return true})}

 <button onclick="teAdd()" class="bb w-full py-2 bg-purple-100 rounded-xl font-bold">+ เพิ่มข้อ</button><div class="flex gap-2"><button onclick="closeModal()" class="bb flex-1 py-2 bg-slate-100 rounded-xl font-bold">ยกเลิก</button><button onclick="saveTE()" class="bb flex-1 py-2 bg-emerald-500 text-white rounded-xl font-bold">บันทึก</button></div></div>`;$('modal').classList.remove('hidden')}

 const it=S.items.find(i=>i.id===id);if(!it.questions?.length)return toast('แบบทดสอบนี้ยังไม่มีข้อสอบ');
 activeTest=id;let left=(it.time||15)*60;const ic='w-full border-2 border-slate-200 rounded-xl p-2 text-xs';
 $('modal').innerHTML=`<div class="card border-4 border-purple-200 p-5 w-full max-w-lg max-h-[90vh] overflow-y-auto space-y-3"><div class="flex justify-between items-center"><h3 class="mali font-bold">${esc(it.title)}</h3><span id="tm" class="bg-yellow-100 rounded-xl px-3 py-1 text-xs font-bold"></span></div><div class="bg-amber-50 border border-amber-200 rounded-xl p-2 text-xs font-bold text-amber-800">⚠️ ห้ามสลับแท็บ — ระบบจะตัดสิทธิ์ทันที</div>${it.questions.map((q,i)=>`<div class="text-xs space-y-1"><p class="font-bold">ข้อ ${i+1}: ${esc(q.q)} <span class="text-slate-400">(${pts(q,it)} คะแนน)</span></p>${qt(q)==='essay'?`<textarea id="a${i}" rows="3" class="${ic}"></textarea>`:qt(q)==='fill'?`<input id="a${i}" class="${ic}" placeholder="คำตอบ">`:(q.opts||[]).map(o=>`<label class="block"><input type="radio" name="q${i}" value="${esc(o)}"> ${esc(o)}</label>`).join('')}</div>`).join('')}<button onclick="finishTest()" class="bb w-full py-2.5 bg-emerald-500 text-white rounded-2xl text-xs font-bold">ส่งคำตอบ</button></div>`;
 $('modal').classList.remove('hidden');
 const tick=()=>{$('tm').textContent=`เหลือ ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;if(left--<=0)finishTest()};tick();timer=setInterval(tick,1000);
 document.addEventListener('visibilitychange',cheat)}
function endTest(){clearInterval(timer);document.removeEventListener('visibilitychange',cheat);closeModal();activeTest=null}
function cheat(){if(!document.hidden||!activeTest)return;const it=S.items.find(i=>i.id===activeTest);(S.subs[it.id]??={})[me.id]={status:'cheated',score:0,at:new Date().toISOString()};notify(`🚨 ${me.name} ถูกตัดสิทธิ์สอบ "${it.title}" (สลับหน้าจอ)`);putSub(it.id,me.id);endTest();save();render();toast('🚨 ตรวจพบการสลับหน้าจอ ถูกตัดสิทธิ์')}
function finishTest(){
 if(!activeTest)return;const it=S.items.find(i=>i.id===activeTest);let sc=0,es=false;
 const answers=it.questions.map((q,i)=>{const a=qt(q)==='mc'?(document.querySelector(`input[name=q${i}]:checked`)?.value||''):$('a'+i).value.trim();if(qt(q)==='essay')es=true;else if(ok(q,a))sc+=pts(q,it);return a});
 (S.subs[it.id]??={})[me.id]={status:es||G()?'submitted':'graded',score:Math.round(sc*10)/10,answers,at:new Date().toISOString(),feedback:''};
 putSub(it.id,me.id);endTest();save();render();toast('ส่งแบบทดสอบแล้ว')}

/* grading */
let gt=null,draw=false;
function openGrade(iid,sid){
 gt={iid,sid};const it=S.items.find(i=>i.id===iid),st=S.students.find(s=>s.id===sid),x=sub(iid,sid)||{};
 $('modal').innerHTML=`<div class="card border-4 border-purple-200 p-5 w-full max-w-lg max-h-[90vh] overflow-y-auto space-y-3"><div><h3 class="mali font-bold">ตรวจ: ${esc(it.title)}</h3><p class="text-xs text-slate-500">${esc(st.name)}</p></div>
 <div class="text-xs bg-slate-50 rounded-xl p-2 break-words">${it.type==='test'?ansHtml(it,x):esc(x.text)||'<i class="text-slate-400">ไม่มีข้อความ</i>'}${x.url?`<br><a class="text-sky-600 underline" target="_blank" rel="noopener" href="${esc(x.url)}">${esc(x.url)}</a>`:''}${attHtml(x.att)}</div>
 <canvas id="cv" width="460" height="220" class="w-full bg-white border border-slate-300 rounded-xl touch-none"></canvas><button onclick="cvClear()" class="text-xs bg-slate-100 rounded-lg px-3 py-1 font-bold">ล้างรอยเขียน</button>
 <div class="grid grid-cols-2 gap-2 text-xs font-bold"><label>คะแนน (เต็ม ${it.max})<input id="gs" type="number" min="0" max="${it.max}" value="${x.score||0}" class="w-full border-2 border-slate-200 rounded-xl p-2 mt-1 font-normal"></label><label>สถานะ<select id="gst" class="w-full border-2 border-slate-200 rounded-xl p-2 mt-1 font-normal"><option value="graded">ตรวจแล้ว</option><option value="revision">ให้แก้ไข</option></select></label></div>
 <textarea id="gf" rows="2" class="w-full border-2 border-slate-200 rounded-xl p-2 text-xs" placeholder="ข้อติชม / คำแนะนำ">${esc(x.feedback)}</textarea>
 <div class="flex gap-2"><button onclick="closeModal()" class="bb flex-1 py-2 bg-slate-100 rounded-xl text-xs font-bold">ปิด</button><button onclick="saveGrade()" class="bb flex-1 py-2 bg-emerald-500 text-white rounded-xl text-xs font-bold">บันทึก</button></div></div>`;
 $('modal').classList.remove('hidden');
 const c=$('cv'),g=c.getContext('2d');g.strokeStyle='#ef4444';g.lineWidth=3;g.lineCap='round';
 const p=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
 c.onpointerdown=e=>{draw=true;g.beginPath();g.moveTo(...p(e))};c.onpointermove=e=>{if(draw){g.lineTo(...p(e));g.stroke()}};c.onpointerup=c.onpointerleave=()=>draw=false}
function cvClear(){const c=$('cv');c.getContext('2d').clearRect(0,0,c.width,c.height)}
function saveGrade(){
 const{iid,sid}=gt,it=S.items.find(i=>i.id===iid);
 const score=Math.min(parseFloat($('gs').value)||0,it.max);
 const x=(S.subs[iid]??={});x[sid]={at:new Date().toISOString(),...x[sid],status:$('gst').value,score,feedback:$('gf').value};
 putSub(iid,sid);save();closeModal();render();toast('บันทึกผลการตรวจแล้ว')}

/* grades (8 levels) */
function calc(sid){let m=0,e=0;tasks().forEach(t=>{m+=t.max||10;const x=sub(t.id,sid);if(x?.status==='graded')e+=x.score||0});
 const p=m?e/m*100:0;const g=p>=80?'A':p>=75?'B+':p>=70?'B':p>=65?'C+':p>=60?'C':p>=55?'D+':p>=50?'D':'F';return{p:p.toFixed(1),g}}
function vGrades(){
 const T=tasks();
 return head('🏅 ผลการเรียน (เฉพาะครู)','A 80+ • B+ 75 • B 70 • C+ 65 • C 60 • D+ 55 • D 50 • F &lt;50',`<button onclick="copyCsv()" class="bb bg-emerald-500 text-white px-4 py-2 rounded-2xl text-xs font-bold shrink-0">📋 คัดลอก CSV</button>`)+`<div class="card overflow-x-auto"><table class="w-full text-xs text-left"><thead class="bg-yellow-50 font-bold"><tr><th class="p-3">เลขที่</th><th class="p-3">ชื่อ-นามสกุล</th>${T.map(t=>`<th class="p-3 text-center">${esc(t.title.split(':')[0])}</th>`).join('')}<th class="p-3 text-center bg-amber-100">รวม %</th><th class="p-3 text-center bg-amber-200">เกรด</th></tr></thead><tbody class="divide-y">${S.students.map(s=>{const r=calc(s.id);return`<tr><td class="p-3 font-bold">${s.no}</td><td class="p-3">${esc(s.name)}</td>${T.map(t=>{const x=sub(t.id,s.id);return`<td class="p-3 text-center">${x?.status==='graded'?x.score:'-'}</td>`}).join('')}<td class="p-3 text-center font-bold bg-amber-50">${r.p}%</td><td class="p-3 text-center font-bold text-purple-700 bg-amber-100">${r.g}</td></tr>`}).join('')}</tbody></table></div>`}
function copyCsv(){
 const csv='เลขที่,รหัส,ชื่อ-นามสกุล,คะแนน(%),เกรด\n'+S.students.map(s=>{const r=calc(s.id);return[s.no,s.code,s.name,r.p,r.g].join(',')}).join('\n');
 (navigator.clipboard?navigator.clipboard.writeText(csv):Promise.reject()).then(()=>toast('คัดลอก CSV แล้ว วางใน Excel/Sheets ได้เลย'),()=>toast('คัดลอกไม่สำเร็จ'))}

if(G())role='student';
render();
(async()=>{
 if(!G())return;
 try{TKEY=localStorage.getItem('lms_key')||''}catch(e){}
 if(TKEY){const x=await gas({action:'auth'}).catch(()=>null);authed=!!(x&&x.ok);if(authed)role='teacher';else TKEY=''}
 await pull(true);setRole(role);
 setInterval(()=>pull(false),15000);
})();
</script>
</body>
