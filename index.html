<script>
/* ===== ตั้งค่า Google Apps Script ===== */
const GAS_URL='https://script.google.com/macros/s/AKfycbwO13uHpPQ7WCOfhTqHGGQzTaVG43UL9pg8_8eoZu7nd3JKsNCTl2HCEfOITu2b8Jcz/exec';
const DRIVE_FOLDER='https://drive.google.com/drive/folders/1Mz3mVDziGgozlM4J7PX0fkYzsU_obfTI';

const $=id=>document.getElementById(id);
window.addEventListener('error',e=>{const t=document.getElementById('st');if(t)t.textContent='⚠️ ข้อผิดพลาดในหน้าเว็บ: '+(e.message||'ไม่ทราบสาเหตุ')});
window.addEventListener('unhandledrejection',e=>{const t=document.getElementById('st');if(t)t.textContent='⚠️ ข้อผิดพลาด: '+((e.reason&&e.reason.message)||e.reason||'ไม่ทราบสาเหตุ')});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K='CLASSROOM_LMS_V2';
let S={
 items:[
  {id:'m1',type:'material',title:'บทที่ 1: การเขียนโปรแกรมเบื้องต้น',desc:'ใบความรู้ตัวแปรและฟังก์ชัน',url:''},
  {id:'e1',type:'exercise',title:'แบบฝึกทักษะ: การประกาศตัวแปร',desc:'เขียนโค้ดคำนวณพื้นที่สามเหลี่ยม',max:10,due:'2026-11-15T23:59'},
  {id:'t1',type:'test',title:'แบบทดสอบย่อย บทที่ 1',desc:'ปรนัย (จับเวลา)',max:10,time:15,questions:[{q:'ข้อใดคือชนิดข้อมูลจำนวนเต็มใน Python?',opts:['int','float','str','bool'],ans:'int'},{q:'คำสั่งแสดงผลใน Python คือข้อใด?',opts:['echo','print','show','out'],ans:'print'}]},
  {id:'p1',type:'project',title:'โครงงานที่ 1: เกม Scratch',desc:'ส่งลิงก์ผลงาน Scratch',max:20,due:'2026-11-20T23:59'}],
 students:[{id:'s1',code:'6601',no:1,name:'นายสมชาย ใจดี'},{id:'s2',code:'6602',no:2,name:'นางสาวสมหญิง รักเรียน'},{id:'s3',code:'6603',no:3,name:'เด็กชายมานพ รักเรียน'}],
 subs:{},notifs:[]};
let role='teacher',me=null,tab='dashboard',timer=null,activeTest=null;
try{const d=JSON.parse(localStorage.getItem(K)||'null');if(d&&(d.items||d.rooms))S={...S,...d}}catch(e){}
let hashed=false;
if(!S.rooms){const c={term:'1',year:'2569',room:'ม.4/1',scode:'',sname:'คอมพิวเตอร์',pw:'',...(S.cfg||{})},m=String(c.room).split('/');S.rooms=[{id:'r1',...c,level:m.length>1?m[0]:'ม.4',room:m.length>1?m[1]:c.room}];S.data={r1:{items:S.items,students:S.students}}}
S.data=S.data||{};S.cur=null;S.subs=S.subs||{};S.notifs=S.notifs||[];
function stash(){if(S.cur)S.data[S.cur]={items:S.items,students:S.students,bonus:S.bonus}}
function repoint(){if(!S.rooms.some(r=>r.id===S.cur))S.cur=S.rooms[0].id;const d=S.data[S.cur]||(S.data[S.cur]={items:[],students:[]});d.bonus=d.bonus||[];S.items=d.items;S.students=d.students;S.bonus=d.bonus;S.cfg=S.rooms.find(r=>r.id===S.cur)}
function useRoom(id){stash();S.cur=id;try{localStorage.setItem('lms_cur',id)}catch(e){}repoint()}
const hashRoom=()=>{const h=(location.hash||'').slice(1);return S.rooms.some(r=>r.id===h)?h:null};
const flat=n=>Object.entries(S.data).flatMap(([rid,d])=>(d[n]||[]).map(x=>({...x,rid})));
const roomLink=()=>location.href.split('#')[0]+'#'+S.cur;
{let c=null;try{c=localStorage.getItem('lms_cur')}catch(e){}S.cur=hashRoom()||(S.rooms.some(r=>r.id===c)?c:S.rooms[0].id);hashed=!!hashRoom();repoint()}
let seen=0;try{seen=+localStorage.getItem('lms_seen')||0}catch(e){}
const sigOf=()=>JSON.stringify([S.rooms,S.data]);
let lastSig=sigOf();
let KEY='',pend=null,inflight=0,unsaved=false,pulling=false,AUTH=false,retry=0,saving=false,subVer=0;
try{KEY=localStorage.getItem('lms_key')||'';unsaved=localStorage.getItem('lms_unsaved')==='1'}catch(e){}
const online=()=>GAS_URL&&!GAS_URL.startsWith('PASTE');
const busy=()=>(/INPUT|TEXTAREA/.test(document.activeElement?.tagName||'')&&$('view').contains(document.activeElement))||[...document.querySelectorAll('#view input[type=file]')].some(i=>i.files&&i.files.length);
const DR=(()=>{try{return JSON.parse(sessionStorage.getItem('lms_dr')||'{}')}catch(e){return{}}})();
const saveDR=()=>{try{sessionStorage.setItem('lms_dr',JSON.stringify(DR))}catch(e){}};
function clearDraft(id){delete DR['t_'+id];delete DR['u_'+id];saveDR()}
document.addEventListener('input',e=>{const id=(e.target&&e.target.id)||'';if(/^[tu]_/.test(id)){DR[id]=e.target.value;saveDR()}});
const qt=q=>q.type||'mc',pts=(q,it)=>q.pts??Math.round(it.max/it.questions.length*10)/10;
const ok=(q,a)=>qt(q)==='mc'?a===q.ans:qt(q)==='fill'&&String(q.ans).split('|').some(x=>x.trim().toLowerCase()===a.toLowerCase());
const notifs=()=>{const r=[];Object.entries(S.subs).forEach(([i,o])=>Object.entries(o).forEach(([d,x])=>{const t=Date.parse(x.at);if(t>seen&&['submitted','cheated'].includes(x.status)){const it=S.items.find(k=>k.id===i),st=S.students.find(k=>k.id===d);r.push({t:(x.status==='cheated'?'🚨 ถูกตัดสิทธิ์: ':'ส่งงาน: ')+(st?.name||d)+' – '+(it?.title||''),time:new Date(t).toLocaleTimeString('th-TH'),k:t})}}));return r.sort((a,b)=>b.k-a.k).slice(0,30)};
const TY={material:{n:'สื่อการเรียน',e:'📖',c:'sky'},exercise:{n:'แบบฝึกทักษะ',e:'✏️',c:'pink'},test:{n:'แบบทดสอบ',e:'📝',c:'purple'},project:{n:'ชิ้นงาน/โครงงาน',e:'🧩',c:'emerald'}};
const tasks=()=>S.items.filter(i=>i.type!=='material');
const isOpen=it=>!it.openAt||new Date()>=new Date(it.openAt);
const lockBox=it=>`<div class="text-xs font-bold text-slate-500 bg-slate-100 rounded-xl p-3">🔒 จะเปิดวันที่ ${esc(it.openAt.replace('T',' '))}</div>`;
const sub=(i,s)=>(S.subs[i]||{})[s];
const tm=()=>new Date().toLocaleTimeString('th-TH');

setInterval(()=>{if(role==='student'&&!busy()&&!activeTest&&$('modal').classList.contains('hidden'))render()},30000);
setInterval(()=>{if(role!=='teacher'||pend||inflight)return;stash();if(sigOf()!==lastSig)save()},10000);
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add('hidden'),2500)}
function notify(t){S.notifs.unshift({t,time:new Date().toLocaleTimeString('th-TH')})}
function setRole(r){role=r;if(r==='student'&&!me){openForm('🎓 เข้าสู่ระบบนักเรียน',[['code','รหัสประจำตัว นร.',''],['pw','รหัสผ่านห้องเรียน (ถ้ามี)','']],async v=>{await pull();const f=S.students.find(x=>x.code===v.code);if(!f)return toast('ไม่พบรหัสนี้ในรายชื่อ');if(!(await pwOk(v.pw)))return toast('รหัสผ่านห้องไม่ถูกต้อง');me=f;render();return true},()=>{role=AUTH?'teacher':'student';render()});}
 if(['students','grades','room','bonus'].includes(tab)&&r==='student')tab='dashboard';render()}
function go(t){tab=t;render()}

 function jsonp(url,ms){return new Promise((res,rej)=>{
 const cb='_cb'+Date.now()+Math.floor(Math.random()*1e6),s=document.createElement('script');
 const clean=()=>{clearTimeout(t);delete window[cb];s.remove()};
 const t=setTimeout(()=>{clean();rej(new Error('abort'))},ms);
 window[cb]=d=>{clean();res(d)};
 s.onerror=()=>{clean();rej(new Error('Load failed'))};
 s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;
 document.head.appendChild(s)})}
 
/* ===== Google Apps Script backend ===== */
async function net(url,opt,tries){
 tries=tries||1;let last;
 for(let i=0;i<tries;i++){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),60000);
  try{
   if(!(opt&&opt.method))return await jsonp(url,30000);
   const r=await fetch(url+(opt&&opt.method==='POST'?'':(url.includes('?')?'&':'?')+'_='+Date.now()),{...(opt||{}),signal:c.signal,redirect:'follow',credentials:'omit'});
   const txt=await r.text();let j;
   try{j=JSON.parse(txt)}catch(e){throw new Error(/<html|<!doctype/i.test(txt)?'AUTH':'BADJSON')}
   return j;
  }catch(e){last=e;if(e&&e.message==='AUTH')break;if(i<tries-1)await new Promise(r=>setTimeout(r,900*(i+1)))}
  finally{clearTimeout(t)}
 }
 throw last}
function errMsg(e){const m=(e&&e.message)||String(e||'');
 if(m==='AUTH')return'Apps Script ตอบเป็นหน้าเว็บ (ยังไม่อนุญาตให้ทุกคนเข้า หรือยังไม่ได้อนุญาตสิทธิ์) ตั้ง Who has access = Anyone แล้ว Deploy ใหม่';
 if(m==='BADJSON')return'Apps Script ตอบกลับผิดรูปแบบ ตรวจ Executions ใน Apps Script';
 if(/abort/i.test(m))return'เซิร์ฟเวอร์ตอบช้าเกินไป';
 return'ติดต่อเซิร์ฟเวอร์ไม่ได้ ('+m+')'}
/* POST ไม่ retry เพื่อกันบันทึกซ้ำ (เช่น เริ่มสอบซ้ำ) */
async function api(b){return net(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...b,key:KEY})},1)}
async function apiRetry(b){return net(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...b,key:KEY})},3)}
async function diag(){
 toast('กำลังตรวจการเชื่อมต่อ...');
 let msg;
 try{const r=await net(GAS_URL+'?action=ping',{},1);
  msg=r.ok?'✅ เชื่อมต่อ Apps Script ได้ (v'+esc(r.v||'?')+')'+(r.folder?'':'<br>⚠️ แต่เข้าโฟลเดอร์ Drive ไม่ได้: เปิด Apps Script แล้ว Run ฟังก์ชันใดก็ได้ 1 ครั้งเพื่ออนุญาตสิทธิ์ จากนั้น Deploy ใหม่'):'⚠️ '+esc(r.error||'ไม่ทราบสาเหตุ')
 }catch(e){msg='⚠️ '+esc(errMsg(e))}
 openForm('ผลการตรวจ<div class="text-xs font-normal mt-2">'+msg+'</div>',[],()=>true);
 pull()}
const ASSETS={async upload(f){if(!online())throw new Error('ยังไม่ได้ตั้งค่า Apps Script URL (GAS_URL)');const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(f)});const x=await api({action:'upload',name:f.name,mime:f.type||'application/octet-stream',b64});if(!x.ok)throw new Error(x.error);return{id:x.id,url:x.url,contentType:f.type}}};
async function pwOk(p){if(!online())return!S.cfg.pw||p===S.cfg.pw;try{const r=await net(GAS_URL+'?action=pw&rid='+encodeURIComponent(S.cur)+'&p='+encodeURIComponent(p),{},2);return!!r.ok}catch(e){toast('⚠️ '+errMsg(e));return false}}
const pullNow=async()=>{for(let i=0;i<60&&pulling;i++)await new Promise(r=>setTimeout(r,200));return pull()};
async function pull(){
 if(!online()||pulling)return;pulling=true;const v0=subVer;
 try{
  const r=await net(GAS_URL+'?action=get&key='+encodeURIComponent(KEY)+'&stu='+encodeURIComponent(me?.id||''),{},3);
  if(!r.ok){$('st').textContent='⚠️ Apps Script ตอบกลับผิดพลาด: '+(r.error||'ไม่ทราบสาเหตุ');return}
  const d=r.data||{};
  if(!d.items){if(role==='teacher'&&KEY)save();return}
  if(v0!==subVer||pend||inflight||(role==='teacher'&&unsaved)||activeTest)return;
  if(d.rooms?.length)S.rooms=d.rooms;else if(d.cfg){const cc={...d.cfg},m=String(cc.room||'').split('/');if(m.length>1){cc.level=m[0];cc.room=m[1]}Object.assign(S.rooms[0],cc)}
  const g={items:{},students:{},bonus:{}};
  ['items','students','bonus'].forEach(n=>(d[n]||[]).forEach(x=>(g[n][x.rid||S.rooms[0].id]??=[]).push(x)));
  new Set([...Object.keys(S.data),...Object.keys(g.items),...Object.keys(g.students),...Object.keys(g.bonus)]).forEach(rid=>S.data[rid]={items:g.items[rid]||[],students:g.students[rid]||[],bonus:g.bonus[rid]||[]});
  S.subs=d.subs||{};
  const h=hashRoom();if(h&&!hashed){hashed=true;S.cur=h}
  repoint();lastSig=sigOf();
  try{localStorage.setItem(K,JSON.stringify({rooms:S.rooms,data:S.data,subs:S.subs}))}catch(e){}
  if(!busy()&&$('modal').classList.contains('hidden'))render();
  $('st').textContent='☁️ เชื่อมต่อ Google Drive แล้ว '+tm();
 }catch(e){$('st').textContent='⚠️ '+errMsg(e)+' • ใช้ข้อมูลที่จำไว้ในเครื่อง '+tm()}
 finally{pulling=false}}
function save(){
 stash();lastSig=sigOf();try{localStorage.setItem(K,JSON.stringify({rooms:S.rooms,data:S.data,subs:S.subs}))}catch(e){}
 if(!online()){$('st').textContent='บันทึกในเครื่องแล้ว (ยังไม่ได้ตั้งค่า Apps Script) '+tm();return}
 if(role!=='teacher'||!KEY){if(role==='teacher')$('st').textContent='ℹ️ ต้องเข้า "มุมครู" (ใส่รหัสครู) จึงจะบันทึกลง Google Drive';return}
 unsaved=true;try{localStorage.setItem('lms_unsaved','1')}catch(e){}clearTimeout(pend);$('st').textContent='⏳ กำลังบันทึก...';pend=setTimeout(flush,500)}
async function flush(){
 if(inflight){clearTimeout(pend);pend=setTimeout(flush,1500);return}
 pend=null;inflight++;
 const sig=sigOf();
 try{
  const r=await apiRetry({action:'saveCore',core:{rooms:S.rooms,items:flat('items'),students:flat('students'),bonus:flat('bonus')}});
  if(r.ok){retry=0;
   if(sigOf()===sig){unsaved=false;try{localStorage.removeItem('lms_unsaved')}catch(e){}$('st').textContent='☁️ บันทึกลง Google Drive แล้ว '+tm()}
   else{lastSig='';$('st').textContent='⏳ กำลังบันทึกส่วนที่แก้เพิ่ม...';if(!pend)pend=setTimeout(flush,800)}
  }else{
   $('st').textContent='⚠️ '+r.error;
   if(String(r.error).includes('รหัสครู')){KEY='';unsaved=false;try{localStorage.removeItem('lms_key');localStorage.removeItem('lms_unsaved')}catch(e){}}
  }
 }catch(e){
  $('st').textContent='⚠️ บันทึกไม่สำเร็จ ลองใหม่ ('+(++retry)+')';
  if(retry<5)setTimeout(()=>{if(unsaved&&!pend&&!inflight)flush()},Math.min(30000,3000*retry));
 }finally{inflight--}}
function putSub(i,d,prev){
 if(!online())return Promise.resolve(true);
 inflight++;subVer++;
 return api({action:'putSub',iid:i,sid:d,sub:S.subs[i][d]}).then(r=>{
  if(!r.ok)throw new Error(r.error||'ไม่ทราบสาเหตุ');
  if(r.sub&&role==='student')S.subs[i][d]=r.sub;
  $('st').textContent='☁️ บันทึกลง Google Drive แล้ว '+tm();
  if(role==='student'&&!busy())render();
  return true;
 }).catch(e=>{
  if(prev!==undefined){if(prev)S.subs[i][d]=prev;else delete S.subs[i][d]}

 }).finally(()=>{inflight--;subVer++})}

 if(!s)return'<span class="px-2 py-0.5 rounded-lg bg-slate-100 text-slate-500 text-[10px] font-bold">ยังไม่ส่ง</span>';
 if(s.status==='started')return'<span class="px-2 py-0.5 rounded-lg bg-rose-200 text-rose-700 text-[10px] font-bold">ออกกลางคัน</span>';

 if(!me)return'<div class="text-xs text-rose-500 font-bold">โปรดเข้าสู่ระบบนักเรียนก่อน</div>';

 const status=`<div class="flex justify-between text-xs"><b>สถานะ:</b>${badge(s,it)}</div>${s?.feedback?`<div class="text-xs bg-yellow-50 border border-yellow-200 rounded-xl p-2">💬 ${esc(s.feedback)}</div>`:''}${markHtml(s)}`;
 if(it.type==='test'){

  if(s?.status==='cheated')return box('<div class="text-xs font-bold text-rose-600">🚨 ถูกตัดสิทธิ์: ตรวจพบการสลับหน้าจอระหว่างสอบ หากมีเหตุผลให้แจ้งครู</div>');

 return`<div class="p-3 bg-slate-50 rounded-2xl space-y-2">${status}<textarea id="t_${it.id}" rows="2" class="w-full border-2 border-slate-200 rounded-xl p-2 text-xs" placeholder="ข้อความส่งงาน...">${esc(s?.text)}</textarea><input id="u_${it.id}" value="${esc(s?.url)}" placeholder="ลิงก์ผลงาน (ถ้ามี)" class="w-full border-2 border-slate-200 rounded-xl p-2 text-xs">${attHtml(s?.att,`rmSubAtt('${it.id}',`)}<input id="fl_${it.id}" type="file" multiple class="w-full text-xs"><div class="flex gap-2"><button onclick="send('${it.id}')" class="bb flex-1 py-2 bg-pink-400 text-white rounded-xl text-xs font-bold">${s?'บันทึกการแก้ไข':'ส่งงาน'}</button>${s?`<button onclick="delSub('${it.id}')" class="bb px-4 py-2 bg-rose-100 text-rose-600 rounded-xl text-xs font-bold">ลบงาน</button>`:''}</div></div>`}
const attHtml=(l,rm)=>(l||[]).map((f,i)=>`<div class="flex items-center gap-2 text-xs">${(f.ct||'').startsWith('image/')?`<img src="${esc(f.url)}" alt="${esc(f.name)}" class="max-h-36 rounded-xl border">`:`<a href="${esc(f.url)}" target="_blank" rel="noopener" class="underline text-sky-600">📎 ${esc(f.name)}</a>`}${rm?`<button onclick="${rm}${i})">✕</button>`:''}</div>`).join('');
async function send(id){
 const it=S.items.find(i=>i.id===id),old=sub(id,me.id),late=old?old.late:!!(it.due&&new Date()>new Date(it.due));
 if(!isOpen(it))return toast('ยังไม่ถึงเวลาเปิด');
 if(old?.status==='graded')return toast('ครูตรวจแล้ว ไม่สามารถแก้ไขได้');
 const text=$('t_'+id).value,url=$('u_'+id).value,att=[...(old?.att||[])],fs=[...$('fl_'+id).files];
 if(fs.length)toast('กำลังอัปโหลดไฟล์...');
 for(const f of fs){try{att.push(await upFile(f))}catch(e){return toast(f.name+': '+e.message)}}
 subVer++;(S.subs[id]??={})[me.id]={at:new Date().toISOString(),text,url,att,status:'submitted',late,score:0,feedback:''};
 toast('กำลังส่งงาน...');
 const done=await putSub(id,me.id,old||null);
 if(done)clearDraft(id);
 save();render();if(done)toast(old?'แก้ไขงานแล้ว':'ส่งงานเรียบร้อย!')}
function delSub(id){openForm('ลบงานที่ส่งนี้?',[],()=>{

 if(online()){inflight++;api({action:'delSub',iid:id,sid:me.id}).then(r=>{if(!r.ok)throw 0}).catch(()=>{S.subs[id][me.id]=prev;toast('⚠️ ลบไม่สำเร็จ');render()}).finally(()=>{inflight--;subVer++})}
 render();return true})}
function resetSub(iid,sid){

 openForm('เปิดสิทธิ์สอบใหม่ให้ '+esc(st?.name||'')+'? (ผลสอบเดิมจะถูกลบ)',[],async()=>{

function itemForm(type,id){
 const o=S.items.find(i=>i.id===id)||{};
 const f=[['title','ชื่อหัวข้อ',o.title||''],['desc','รายละเอียด',o.desc||'','area']];
 const OP=['openAt','🕒 เวลาเปิด (เว้นว่าง = เปิดทันที)',o.openAt||'','dt'];
 if(type==='material')f.push(['url','ลิงก์เนื้อหา (ไม่บังคับ)',o.url||''],['file','แนบไฟล์ / รูปภาพ','','file'],OP);
 else f.push(['max','คะแนนเต็ม',o.max||'10'],OP,['due','กำหนดส่ง (กรอกอัตโนมัติ แก้ไขได้)',o.due||autoDue(),'dt']);
 openForm((id?'แก้ไข':'เพิ่ม')+TY[type].n,f,async v=>{

(function(){

  for(let i=1;i<pts.length-1;i++){const d=pdist(pts[i],pts[0],pts[pts.length-1]);if(d>mx){mx=d;ix=i}}

  const half=Math.round(it.max/2*100)/100;
  if(['graded','revision'].includes(x.status))gs.value=x.score??0;
  else if(x.status==='submitted')gs.value=x.late?half:it.max;
  document.querySelectorAll('#modal div.bg-amber-50').forEach(d=>{
   if(d.textContent.includes('ส่งช้า'))d.textContent='⏰ ส่งช้า: ระบบให้คะแนนเริ่มต้น '+half+' (ครึ่งหนึ่งของเต็ม) ครูปรับคะแนนได้'});
  if(x.status==='submitted'&&!x.late){
   const m=document.createElement('div');
   m.className='text-xs bg-emerald-50 border border-emerald-200 rounded-xl p-2 font-bold text-emerald-800';
   m.textContent='✅ ส่งตรงเวลา: ระบบให้คะแนนเต็ม '+it.max+' ครูปรับคะแนนได้';
   gs.closest('.grid').before(m)}};

 /* บันทึกคะแนนตามที่ครูกรอก (ไม่หักซ้ำ) */
 window.saveGrade=async function(){
  const{iid,sid}=gt,it=S.items.find(i=>i.id===iid);
  const prev=(S.subs[iid]||{})[sid]||{};
  const raw=Math.round(Math.min(Math.max(parseFloat($('gs').value)||0,0),it.max)*100)/100;
  const score=raw,status=$('gst').value,feedback=$('gf').value;
  let marks=[...(prev.marks||[])];
  try{if(Object.keys(PDFS).length)toast('กำลังบันทึกหน้า PDF...');marks=await pdfSave(iid,sid,marks)}catch(e){return toast('บันทึกรอยเขียน PDF ไม่สำเร็จ: '+((e&&e.message)||''))}
  const cs=[...document.querySelectorAll('#modal canvas.mk')].filter(c=>c.dataset.dirty==='1');
  if(cs.length)toast('กำลังบันทึกรอยเขียน...');
  try{for(const c of cs){const i=+c.dataset.i;const b=await new Promise(r=>c.toBlob(r,'image/png'));if(b.size>8*1024*1024)throw new Error('รอยเขียนใหญ่เกิน 8 MB');const f=new File([b],'mark-'+iid+'-'+sid+'-'+i+'.png',{type:'image/png'});const r=await ASSETS.upload(f);marks=marks.filter(m=>m.i!==i);marks.push({i,url:r.url,name:f.name,ct:'image/png'})}}
  catch(e){return toast('บันทึกรอยเขียนไม่สำเร็จ: '+((e&&e.message)||''))}
  const x=(S.subs[iid]??={});
  x[sid]={at:new Date().toISOString(),...x[sid],status,raw,score,feedback,marks};
  putSub(iid,sid);save();closeModal();render();toast('บันทึกผลการตรวจแล้ว')};

 /* 4) ยางลบ */
 const _pt=paintTools;
 window.paintTools=function(){_pt();const b=$('gm-er');if(b)b.style.background=PEN.m==='eraser'?'#fbcfe8':'#fff'};
 const _sp=setPen;
 window.setPen=function(k,v){if(k==='c'&&PEN.m==='eraser')PEN.m='pen';_sp(k,v)};
 let er=null,warned=false;
 const pt=(c,e)=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
 const cut=(c,a,b)=>{const g=c.getContext('2d');g.save();g.globalCompositeOperation='destination-out';g.lineCap='round';g.lineJoin='round';g.lineWidth=Math.max(10,c.width/160*PSZ[PEN.s][1]*5);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();g.restore()};
 document.addEventListener('pointerdown',e=>{
  const c=e.target;
  if(PEN.m!=='eraser'||!c.matches||!c.matches('#modal canvas.mk,#modal canvas.pk'))return;
  e.preventDefault();e.stopPropagation();
  if(c.dataset.dirty!=='1'){if(!warned){warned=true;toast('ยางลบลบได้เฉพาะรอยที่เพิ่งเขียนในรอบนี้')}return}
  try{c.setPointerCapture(e.pointerId)}catch(_){}
  const p=pt(c,e);er={c,last:p};cut(c,p,p)},true);
 document.addEventListener('pointermove',e=>{
  if(!er||e.target!==er.c)return;
  e.stopPropagation();const p=pt(er.c,e);cut(er.c,er.last,p);er.last=p},true);
 ['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>{er=null},true));
})();
</script>
<script>
(function(){
 window.maxForm=function(id){
  if(role!=='teacher')return;
  const it=S.items.find(i=>i.id===id);if(!it)return;
  openForm('🎯 แก้คะแนนเต็ม: '+esc(it.title),
   [['max','คะแนนเต็มใหม่ (ตอนนี้ '+it.max+')',it.max],
    ['mode','คะแนนที่ตรวจแล้ว','scale','sel',[['scale','ปรับตามสัดส่วน'],['keep','คงคะแนนเดิม (ไม่เกินเต็มใหม่)']]]],
   async v=>{
    const nm=Math.round((parseFloat(v.max)||0)*100)/100;
    if(nm<=0)return toast('กรอกคะแนนเต็มเป็นตัวเลขมากกว่า 0');
    const old=+it.max||10,f=nm/old,r2=n=>Math.round(n*100)/100,o=S.subs[id]||{},ch=[];
    Object.keys(o).forEach(sid=>{
     const x=o[sid];if(typeof x.score!=='number')return;
     if(!['graded','revision','submitted'].includes(x.status))return;
     if(v.mode==='scale'){x.score=r2(x.score*f);if(typeof x.raw==='number')x.raw=r2(x.raw*f)}
     else{x.score=Math.min(x.score,nm);if(typeof x.raw==='number')x.raw=Math.min(x.raw,nm)}
     ch.push(sid)});
    it.max=nm;
    save();render();
    toast('กำลังซิงก์...');
    let good=true;
    if(online()&&ch.length){
     inflight++;subVer++;
     try{
      const r=await api({action:'putSubs',list:ch.map(sid=>({iid:id,sid,sub:o[sid]}))});
      if(!r.ok){good=false;toast('⚠️ '+(r.error||'ไม่สำเร็จ'))}
     }catch(e){good=false;toast('⚠️ '+errMsg(e))}
     finally{inflight--;subVer++}
    }
    if(good)toast('แก้คะแนนเต็มเป็น '+nm+' เรียบร้อย ('+ch.length+' งาน)');
    return true})};

 const _r=window.render;
 window.render=function(){
  _r.apply(this,arguments);
  if(role!=='teacher')return;
  document.querySelectorAll('#view button[onclick^="delItem("]').forEach(b=>{
   const id=/delItem\('([^']+)'\)/.exec(b.getAttribute('onclick'))?.[1];
   if(!id||b.previousElementSibling?.dataset.mx)return;
   const m=document.createElement('button');
   m.dataset.mx='1';m.title='แก้คะแนนเต็ม';m.textContent='🎯';
   m.onclick=()=>maxForm(id);
   b.parentNode.insertBefore(m,b)})};
})();
</script>
