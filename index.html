<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- GitHub Pages version: backend = Google Apps Script (Code.gs) -->
<script src="https://cdn.tailwindcss.com/3.4.17"></script>

<body class="antialiased">
<div class="bg-pink-200/90 text-[11px] font-bold py-1 text-center">💾 <span id="st">บันทึกอัตโนมัติในเบราว์เซอร์</span> <span class="opacity-60">• v8</span></div>
<header class="bg-white/80 backdrop-blur border-b-4 border-pink-200 sticky top-0 z-30">
 <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
  <div class="flex items-center gap-2"><span class="text-3xl">🐥</span><div><b class="mali text-lg leading-none block">Classroom by KRU.yui</b><span id="hs" class="text-[10px] text-slate-500"></span></div></div>
  <div class="flex items-center gap-2">
   <button id="bk" onclick="backup()" title="สำรองข้อมูลทันที" class="hidden bb bg-white border-2 border-pink-200 rounded-2xl px-3 py-1.5 text-sm">💾</button><div class="relative"><button onclick="$('nd').classList.toggle('hidden')" class="bb bg-white border-2 border-pink-200 rounded-2xl px-3 py-1.5 text-sm relative">🔔<span id="nb" class="hidden absolute -top-1 -right-1 bg-rose-500 text-white rounded-full text-[9px] w-4 h-4 flex items-center justify-center"></span></button>
    <div id="nd" class="hidden absolute right-0 mt-2 w-72 card border-2 border-pink-200 p-3 text-xs z-50"><div class="flex justify-between font-bold mb-2"><span>การแจ้งเตือน</span><button onclick="seen=Date.now();try{localStorage.setItem('lms_seen',seen)}catch(e){}render()" class="text-slate-400">ล้าง</button></div><div id="nl" class="space-y-2 max-h-60 overflow-y-auto"></div></div></div>
   <div class="bg-slate-100 p-1 rounded-2xl flex text-xs font-bold"><button id="r-teacher" onclick="setRole('teacher')" class="px-3 py-1.5 rounded-xl">👩‍🏫 ครู</button><button id="r-student" onclick="setRole('student')" class="px-3 py-1.5 rounded-xl">🎓 นักเรียน</button></div>
  </div>
 </div>
</header>
<div class="max-w-6xl mx-auto px-4 py-5 flex flex-col md:flex-row gap-5">
 <aside class="md:w-56 shrink-0"><div class="card border-2 border-pink-100 p-3 md:sticky md:top-24">
  <div id="who" class="p-3 rounded-2xl bg-pink-50 mb-3 text-xs"></div>
  <select id="roomSel" onchange="switchRoom(this.value)" class="w-full border-2 border-pink-200 rounded-xl p-2 text-xs mb-2 bg-white"></select>
  <nav id="nav" class="flex md:block gap-1 overflow-x-auto"></nav></div></aside>
 <main id="view" class="flex-1 min-w-0 space-y-4"></main>
</div>

<script>
/* ===== ตั้งค่า Google Apps Script ===== */
const GAS_URL='https://script.google.com/macros/s/AKfycby3T8gDtY4KEOpWBftIOivUEqKJhtQgCS0QiIs9sns4F-cP-vXHbmbteUFpgjVE3JCu/exec';
const DRIVE_FOLDER='https://drive.google.com/drive/folders/1Mz3mVDziGgozlM4J7PX0fkYzsU_obfTI';

const $=id=>document.getElementById(id);
window.addEventListener('error',e=>{const t=document.getElementById('st');if(t)t.textContent='⚠️ ข้อผิดพลาดในหน้าเว็บ: '+(e.message||'ไม่ทราบสาเหตุ')});
window.addEventListener('unhandledrejection',e=>{const t=document.getElementById('st');if(t)t.textContent='⚠️ ข้อผิดพลาด: '+((e.reason&&e.reason.message)||e.reason||'ไม่ทราบสาเหตุ')});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K='CLASSROOM_LMS_V2';
let S={
 items:[
  {id:'m1',type:'material',title:'บทที่ 1: การเขียนโปรแกรมเบื้องต้น',desc:'ใบความรู้ตัวแปรและฟังก์ชัน',url:''},
  {id:'e1',type:'exercise',title:'แบบฝึกทักษะ: การประกาศตัวแปร',desc:'เขียนโค้ดคำนวณพื้นที่สามเหลี่ยม',max:10,due:'2026-11-15T23:59'},
  {id:'t1',type:'test',title:'แบบทดสอบย่อย บทที่ 1',desc:'ปรนัย (จับเวลา)',max:10,time:15,questions:[{q:'ข้อใดคือชนิดข้อมูลจำนวนเต็มใน Python?',opts:['int','float','str','bool'],ans:'int'},{q:'คำสั่งแสดงผลใน Python คือข้อใด?',opts:['echo','print','show','out'],ans:'print'}]},
  {id:'p1',type:'project',title:'โครงงานที่ 1: เกม Scratch',desc:'ส่งลิงก์ผลงาน Scratch',max:20,due:'2026-11-20T23:59'}],
 students:[{id:'s1',code:'6601',no:1,name:'นายสมชาย ใจดี'},{id:'s2',code:'6602',no:2,name:'นางสาวสมหญิง รักเรียน'},{id:'s3',code:'6603',no:3,name:'เด็กชายมานพ รักเรียน'}],
 subs:{},notifs:[]};
let role='teacher',me=null,tab='dashboard',timer=null,activeTest=null;
try{const d=JSON.parse(localStorage.getItem(K)||'null');if(d&&(d.items||d.rooms))S={...S,...d}}catch(e){}
let hashed=false;
if(!S.rooms){const c={term:'1',year:'2569',room:'ม.4/1',scode:'',sname:'คอมพิวเตอร์',pw:'',...(S.cfg||{})},m=String(c.room).split('/');S.rooms=[{id:'r1',...c,level:m.length>1?m[0]:'ม.4',room:m.length>1?m[1]:c.room}];S.data={r1:{items:S.items,students:S.students}}}
S.data=S.data||{};S.cur=null;S.subs=S.subs||{};S.notifs=S.notifs||[];
function stash(){if(S.cur)S.data[S.cur]={items:S.items,students:S.students,bonus:S.bonus}}
function repoint(){if(!S.rooms.some(r=>r.id===S.cur))S.cur=S.rooms[0].id;const d=S.data[S.cur]||(S.data[S.cur]={items:[],students:[]});d.bonus=d.bonus||[];S.items=d.items;S.students=d.students;S.bonus=d.bonus;S.cfg=S.rooms.find(r=>r.id===S.cur)}
function useRoom(id){stash();S.cur=id;try{localStorage.setItem('lms_cur',id)}catch(e){}repoint()}
const hashRoom=()=>{const h=(location.hash||'').slice(1);return S.rooms.some(r=>r.id===h)?h:null};
const flat=n=>Object.entries(S.data).flatMap(([rid,d])=>(d[n]||[]).map(x=>({...x,rid})));
const roomLink=()=>location.href.split('#')[0]+'#'+S.cur;
{let c=null;try{c=localStorage.getItem('lms_cur')}catch(e){}S.cur=hashRoom()||(S.rooms.some(r=>r.id===c)?c:S.rooms[0].id);hashed=!!hashRoom();repoint()}
let seen=0;try{seen=+localStorage.getItem('lms_seen')||0}catch(e){}
const sigOf=()=>JSON.stringify([S.rooms,S.data]);
let lastSig=sigOf();
let KEY='',pend=null,inflight=0,unsaved=false,pulling=false,AUTH=false,retry=0,saving=false,subVer=0;
try{KEY=localStorage.getItem('lms_key')||'';unsaved=localStorage.getItem('lms_unsaved')==='1'}catch(e){}
const online=()=>GAS_URL&&!GAS_URL.startsWith('PASTE');
const busy=()=>(/INPUT|TEXTAREA/.test(document.activeElement?.tagName||'')&&$('view').contains(document.activeElement))||[...document.querySelectorAll('#view input[type=file]')].some(i=>i.files&&i.files.length);
const DR=(()=>{try{return JSON.parse(sessionStorage.getItem('lms_dr')||'{}')}catch(e){return{}}})();
const saveDR=()=>{try{sessionStorage.setItem('lms_dr',JSON.stringify(DR))}catch(e){}};
function clearDraft(id){delete DR['t_'+id];delete DR['u_'+id];saveDR()}
document.addEventListener('input',e=>{const id=(e.target&&e.target.id)||'';if(/^[tu]_/.test(id)){DR[id]=e.target.value;saveDR()}});
const qt=q=>q.type||'mc',pts=(q,it)=>q.pts??Math.round(it.max/it.questions.length*10)/10;
const ok=(q,a)=>qt(q)==='mc'?a===q.ans:qt(q)==='fill'&&String(q.ans).split('|').some(x=>x.trim().toLowerCase()===a.toLowerCase());
const notifs=()=>{const r=[];Object.entries(S.subs).forEach(([i,o])=>Object.entries(o).forEach(([d,x])=>{const t=Date.parse(x.at);if(t>seen&&['submitted','cheated'].includes(x.status)){const it=S.items.find(k=>k.id===i),st=S.students.find(k=>k.id===d);r.push({t:(x.status==='cheated'?'🚨 ถูกตัดสิทธิ์: ':'ส่งงาน: ')+(st?.name||d)+' – '+(it?.title||''),time:new Date(t).toLocaleTimeString('th-TH'),k:t})}}));return r.sort((a,b)=>b.k-a.k).slice(0,30)};
const TY={material:{n:'สื่อการเรียน',e:'📖',c:'sky'},exercise:{n:'แบบฝึกทักษะ',e:'✏️',c:'pink'},test:{n:'แบบทดสอบ',e:'📝',c:'purple'},project:{n:'ชิ้นงาน/โครงงาน',e:'🧩',c:'emerald'}};
const tasks=()=>S.items.filter(i=>i.type!=='material');
const isOpen=it=>!it.openAt||new Date()>=new Date(it.openAt);
const lockBox=it=>`<div class="text-xs font-bold text-slate-500 bg-slate-100 rounded-xl p-3">🔒 จะเปิดวันที่ ${esc(it.openAt.replace('T',' '))}</div>`;
const sub=(i,s)=>(S.subs[i]||{})[s];
const tm=()=>new Date().toLocaleTimeString('th-TH');

setInterval(()=>{if(role==='student'&&!busy()&&!activeTest&&$('modal').classList.contains('hidden'))render()},30000);
setInterval(()=>{if(role!=='teacher'||pend||inflight)return;stash();if(sigOf()!==lastSig)save()},10000);
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add('hidden'),2500)}
function notify(t){S.notifs.unshift({t,time:new Date().toLocaleTimeString('th-TH')})}
function setRole(r){role=r;if(r==='student'&&!me){openForm('🎓 เข้าสู่ระบบนักเรียน',[['code','รหัสประจำตัว นร.',''],['pw','รหัสผ่านห้องเรียน (ถ้ามี)','']],async v=>{await pull();const f=S.students.find(x=>x.code===v.code);if(!f)return toast('ไม่พบรหัสนี้ในรายชื่อ');if(!(await pwOk(v.pw)))return toast('รหัสผ่านห้องไม่ถูกต้อง');me=f;render();return true},()=>{role=AUTH?'teacher':'student';render()});}
 if(['students','grades','room','bonus'].includes(tab)&&r==='student')tab='dashboard';render()}
function go(t){tab=t;render()}

/* ===== Google Apps Script backend ===== */
async function api(b){const c=new AbortController(),t=setTimeout(()=>c.abort(),25000);try{const r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...b,key:KEY}),signal:c.signal});return await r.json()}finally{clearTimeout(t)}}
const ASSETS={async upload(f){if(!online())throw new Error('ยังไม่ได้ตั้งค่า Apps Script URL (GAS_URL)');const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(f)});const x=await api({action:'upload',name:f.name,mime:f.type||'application/octet-stream',b64});if(!x.ok)throw new Error(x.error);return{id:x.id,url:x.url,contentType:f.type}}};
async function pwOk(p){if(!online())return!S.cfg.pw||p===S.cfg.pw;const r=await fetch(GAS_URL+'?action=pw&rid='+encodeURIComponent(S.cur)+'&p='+encodeURIComponent(p)).then(r=>r.json()).catch(()=>({}));return!!r.ok}
async function pull(){
 if(!online()||pulling)return;pulling=true;const v0=subVer;
 try{
  const c=new AbortController(),tt=setTimeout(()=>c.abort(),20000);let r;
  try{r=await(await fetch(GAS_URL+'?action=get&key='+encodeURIComponent(KEY)+'&sid='+encodeURIComponent(me?.id||''),{signal:c.signal})).json()}finally{clearTimeout(tt)}
  if(!r.ok){$('st').textContent='⚠️ Apps Script ตอบกลับผิดพลาด: '+(r.error||'ไม่ทราบสาเหตุ');return}
  const d=r.data||{};
  if(!d.items){if(role==='teacher'&&KEY)save();return}
  if(v0!==subVer||pend||inflight||(role==='teacher'&&unsaved)||activeTest)return;
  if(d.rooms?.length)S.rooms=d.rooms;else if(d.cfg){const cc={...d.cfg},m=String(cc.room||'').split('/');if(m.length>1){cc.level=m[0];cc.room=m[1]}Object.assign(S.rooms[0],cc)}
  const g={items:{},students:{},bonus:{}};
  ['items','students','bonus'].forEach(n=>(d[n]||[]).forEach(x=>(g[n][x.rid||S.rooms[0].id]??=[]).push(x)));
  new Set([...Object.keys(S.data),...Object.keys(g.items),...Object.keys(g.students),...Object.keys(g.bonus)]).forEach(rid=>S.data[rid]={items:g.items[rid]||[],students:g.students[rid]||[],bonus:g.bonus[rid]||[]});
  S.subs=d.subs||{};
  const h=hashRoom();if(h&&!hashed){hashed=true;S.cur=h}
  repoint();lastSig=sigOf();
  try{localStorage.setItem(K,JSON.stringify({rooms:S.rooms,data:S.data,subs:S.subs}))}catch(e){}
  if(!busy()&&$('modal').classList.contains('hidden'))render();
  $('st').textContent='☁️ เชื่อมต่อ Google Drive แล้ว '+tm();
 }catch(e){$('st').textContent='⚠️ เชื่อมต่อ Apps Script ไม่ได้ ตรวจ URL, สิทธิ์ Anyone และ Deploy เวอร์ชันใหม่'}
 finally{pulling=false}}
function save(){
 stash();lastSig=sigOf();try{localStorage.setItem(K,JSON.stringify({rooms:S.rooms,data:S.data,subs:S.subs}))}catch(e){}
 if(!online()){$('st').textContent='บันทึกในเครื่องแล้ว (ยังไม่ได้ตั้งค่า Apps Script) '+tm();return}
 if(role!=='teacher'||!KEY){if(role==='teacher')$('st').textContent='ℹ️ ต้องเข้า "มุมครู" (ใส่รหัสครู) จึงจะบันทึกลง Google Drive';return}
 unsaved=true;try{localStorage.setItem('lms_unsaved','1')}catch(e){}clearTimeout(pend);$('st').textContent='⏳ กำลังบันทึก...';pend=setTimeout(flush,1200)}
async function flush(){
 if(inflight){clearTimeout(pend);pend=setTimeout(flush,1500);return}
 pend=null;inflight++;
 const sig=sigOf();
 try{
  const r=await api({action:'saveCore',core:{rooms:S.rooms,items:flat('items'),students:flat('students'),bonus:flat('bonus')}});
  if(r.ok){retry=0;
   if(sigOf()===sig){unsaved=false;try{localStorage.removeItem('lms_unsaved')}catch(e){}$('st').textContent='☁️ บันทึกลง Google Drive แล้ว '+tm()}
   else{lastSig='';$('st').textContent='⏳ กำลังบันทึกส่วนที่แก้เพิ่ม...';if(!pend)pend=setTimeout(flush,800)}
  }else{
   $('st').textContent='⚠️ '+r.error;
   if(String(r.error).includes('รหัสครู')){KEY='';unsaved=false;try{localStorage.removeItem('lms_key');localStorage.removeItem('lms_unsaved')}catch(e){}}
  }
 }catch(e){
  $('st').textContent='⚠️ บันทึกไม่สำเร็จ ลองใหม่ ('+(++retry)+')';
  if(retry<5)setTimeout(()=>{if(unsaved&&!pend&&!inflight)flush()},Math.min(30000,3000*retry));
 }finally{inflight--}}
function putSub(i,d,prev){
 if(!online())return Promise.resolve(true);
 inflight++;subVer++;
 return api({action:'putSub',iid:i,sid:d,sub:S.subs[i][d]}).then(r=>{
  if(!r.ok)throw new Error(r.error||'ไม่ทราบสาเหตุ');
  if(r.sub&&role==='student')S.subs[i][d]=r.sub;
  $('st').textContent='☁️ บันทึกลง Google Drive แล้ว '+tm();
  if(role==='student'&&!busy())render();
  return true;
 }).catch(e=>{
  if(prev!==undefined){if(prev)S.subs[i][d]=prev;else delete S.subs[i][d]}
  toast('⚠️ บันทึกไม่สำเร็จ: '+((e&&e.message)||'เชื่อมต่อไม่ได้')+(prev!==undefined?' กรุณาส่งใหม่':''));
  $('st').textContent='⚠️ บันทึกขึ้นเซิร์ฟเวอร์ไม่สำเร็จ';
  if(role==='student'&&!busy())render();
  return false;
 }).finally(()=>{inflight--;subVer++})}
addEventListener('pagehide',()=>{if(role==='teacher'&&KEY&&online()&&(pend||unsaved)){stash();try{navigator.sendBeacon(GAS_URL,JSON.stringify({action:'saveCore',key:KEY,core:{rooms:S.rooms,items:flat('items'),students:flat('students'),bonus:flat('bonus')}}))}catch(e){}}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&role==='teacher'&&pend){clearTimeout(pend);flush()}});

/* modal form */
function openForm(title,fields,cb,onCancel){
 const ic='w-full border-2 border-slate-200 rounded-xl p-2 mt-1 font-normal';
 $('modal').innerHTML=`<div class="card border-4 border-pink-200 p-5 w-full max-w-sm space-y-3 max-h-[90vh] overflow-y-auto"><h3 class="mali font-bold text-lg">${title}</h3>${fields.map(([k,l,v,t,x])=>`<label class="block text-xs font-bold">${l}${t==='area'?`<textarea id="f_${k}" rows="4" class="${ic}">${esc(v)}</textarea>`:t==='sel'?`<select id="f_${k}" class="${ic}">${(x||[]).map(([a,b])=>`<option value="${esc(a)}" ${a===v?'selected':''}>${esc(b)}</option>`).join('')}</select>`:t==='dt'?`<input id="f_${k}" type="datetime-local" value="${esc(v)}" class="${ic}">`:t==='file'?`<input id="f_${k}" type="file" ${x?`accept="${x}"`:''} class="w-full text-xs mt-1 font-normal">`:`<input id="f_${k}" value="${esc(v)}" class="${ic}">`}</label>`).join('')}<div class="flex gap-2"><button id="fc" class="bb flex-1 py-2 rounded-xl bg-slate-100 text-xs font-bold">ยกเลิก</button><button id="fo" class="bb flex-1 py-2 rounded-xl bg-pink-400 text-white text-xs font-bold">ตกลง</button></div></div>`;
 $('modal').classList.remove('hidden');
 $('fc').onclick=()=>{closeModal();onCancel&&onCancel()};
 $('fo').onclick=async()=>{const v={};fields.forEach(([k,,,t])=>v[k]=t==='file'?$('f_'+k).files[0]:$('f_'+k).value.trim());if(await cb(v))closeModal()};
}
function closeModal(){$('modal').classList.add('hidden');$('modal').innerHTML=''}

/* views */
function render(){
 const N=role==='teacher'?notifs():[];const c=S.cfg;$('hs').textContent=`${c.sname} ${c.scode} • ${c.level}/${c.room} • ภาคเรียน ${c.term}/${c.year}`;$('bk').classList.toggle('hidden',role!=='teacher');$('roomSel').innerHTML=S.rooms.map(r=>`<option value="${r.id}" ${r.id===S.cur?'selected':''}>${esc(r.level)}/${esc(r.room)} ${esc(r.sname)}</option>`).join('');$('roomSel').classList.toggle('hidden',role!=='teacher');
 const nav=[['dashboard','📊','ภาพรวม'],['room','🏫','ห้องเรียน',1],['students','👥','รายชื่อ',1],['material','📖','สื่อ'],['exercise','✏️','แบบฝึกทักษะ'],['test','📝','แบบทดสอบ'],['project','🧩','ชิ้นงาน'],['grades','🏅','ผลการเรียน',1],['bonus','⭐','คะแนนพิเศษ',1]];

 if(!s)return'<span class="px-2 py-0.5 rounded-lg bg-slate-100 text-slate-500 text-[10px] font-bold">ยังไม่ส่ง</span>';
 if(s.status==='started')return'<span class="px-2 py-0.5 rounded-lg bg-rose-200 text-rose-700 text-[10px] font-bold">ออกกลางคัน</span>';

 return s.late?'<span class="px-2 py-0.5 rounded-lg bg-amber-100 text-amber-700 text-[10px] font-bold">ส่งช้า</span>':`<span class="px-2 py-0.5 rounded-lg bg-sky-100 text-sky-700 text-[10px] font-bold">${i.type==='test'?'ส่งแล้ว':'ตรงเวลา'}</span>`}

async function send(id){

const LET='กขคงจ',LAT='abcde';
function parseQ(text){
 const L=String(text).replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean),qs=[];let cur=null;
 const qRe=/^(?:ข้อ(?:ที่)?\s*)?(\d{1,3})\s*[.)．:]\s*(.+)/,oRe=/^\(?([กขคงจA-Ea-e])[.)．]\s*(.+)/,aRe=/^(?:เฉลย|คำตอบ|ตอบ|ans(?:wer)?)\s*(?:ข้อ)?\s*[:：.\-]?\s*(.+)$/i;
 const push=()=>{if(cur&&cur.q)qs.push(mkQ(cur.q,cur.opts,cur.ans));cur=null};
 for(const l of L){
  let m=aRe.exec(l);if(m&&cur){cur.ans=m[1].trim();continue}
  m=qRe.exec(l);if(m){push();cur={q:m[2].trim(),opts:[],ans:''};continue}
  m=oRe.exec(l);if(m&&cur){cur.opts.push(m[2].trim());continue}
  if(cur){if(cur.opts.length)cur.opts[cur.opts.length-1]+=' '+l;else cur.q+=' '+l}}
 push();return qs}
function mkQ(q,opts,ansRaw){
 ansRaw=String(ansRaw||'').trim();
 if(opts.length>=2){
  let ans='';const m=/^([กขคงจA-Ea-e1-5])(?:[\s.)．:]|$)/.exec(ansRaw);
  if(m){const ch=m[1],i=/\d/.test(ch)?+ch-1:LET.includes(ch)?LET.indexOf(ch):LAT.indexOf(ch.toLowerCase());if(i>=0&&i<opts.length)ans=opts[i]}
  if(!ans){const t=opts.find(o=>o.toLowerCase()===ansRaw.toLowerCase());if(t)ans=t}
  return {type:'mc',q,opts,ans,pts:1}}
 return ansRaw?{type:'fill',q,opts:[],ans:ansRaw,pts:1}:{type:'essay',q,opts:[],ans:'',pts:1}}
function parseCsvRows(t){const rows=[];let r=[],c='',qo=false;t=String(t).replace(/\uFEFF/g,'').replace(/\r/g,'');
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(qo){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else qo=false}else c+=ch}
  else if(ch==='"')qo=true;else if(ch===','){r.push(c);c=''}else if(ch==='\n'){r.push(c);rows.push(r);r=[];c=''}else c+=ch}

function parseCsvQ(t){
 const rows=parseCsvRows(t);if(rows.length&&/^(คำถาม|question|โจทย์)/i.test(rows[0][0].trim()))rows.shift();

 <button onclick="teAdd()" class="bb w-full py-2 bg-purple-100 rounded-xl font-bold">+ เพิ่มข้อ</button><div class="flex gap-2"><button onclick="closeModal()" class="bb flex-1 py-2 bg-slate-100 rounded-xl font-bold">ยกเลิก</button><button onclick="saveTE()" class="bb flex-1 py-2 bg-emerald-500 text-white rounded-xl font-bold">บันทึก</button></div></div>`;$('modal').classList.remove('hidden')}

 TE.max=Math.round(TE.questions.reduce((a,q)=>a+q.pts,0)*10)/10;const i=S.items.findIndex(x=>x.id===TE.id);if(i>=0)S.items[i]=TE;else{TE.id='t'+Date.now();S.items.push(TE)}

/* test with anti-cheat */
async function startTest(id){
 const blocked=()=>{if(!sub(id,me.id))return false;toast('คุณส่งแบบทดสอบนี้แล้ว ไม่สามารถทำซ้ำได้');render();return true};
 if(blocked())return;
 toast('กำลังตรวจสอบสถานะ...');await pull();
 if(blocked())return;
 const it=S.items.find(i=>i.id===id);if(!it.questions?.length)return toast('แบบทดสอบนี้ยังไม่มีข้อสอบ');
 if(!isOpen(it))return toast('ยังไม่ถึงเวลาเปิด');
 if(it.due&&new Date()>new Date(it.due))return toast('หมดเวลารับแบบทดสอบแล้ว');
 (S.subs[id]??={})[me.id]={status:'started',at:new Date().toISOString()};

 if(!(await putSub(id,me.id,null))){await pull();render();return}
 activeTest=id;let left=(it.time||15)*60;const ic='w-full border-2 border-slate-200 rounded-xl p-2 text-xs';
 $('modal').innerHTML=`<div class="card border-4 border-purple-200 p-5 w-full max-w-lg max-h-[90vh] overflow-y-auto space-y-3"><div class="flex justify-between items-center"><h3 class="mali font-bold">${esc(it.title)}</h3><span id="tm" class="bg-yellow-100 rounded-xl px-3 py-1 text-xs font-bold"></span></div><div class="bg-amber-50 border border-amber-200 rounded-xl p-2 text-xs font-bold text-amber-800">⚠️ ห้ามสลับแท็บ — ระบบจะตัดสิทธิ์ทันที</div>${it.questions.map((q,i)=>`<div class="text-xs space-y-1"><p class="font-bold">ข้อ ${i+1}: ${esc(q.q)} </p>${qt(q)==='essay'?`<textarea id="a${i}" rows="3" class="${ic}"></textarea>`:qt(q)==='fill'?`<input id="a${i}" class="${ic}" placeholder="คำตอบ">`:(q.opts||[]).map(o=>`<label class="block"><input type="radio" name="q${i}" value="${esc(o)}"> ${esc(o)}</label>`).join('')}</div>`).join('')}<button onclick="finishTest()" class="bb w-full py-2.5 bg-emerald-500 text-white rounded-2xl text-xs font-bold">ส่งคำตอบ</button></div>`;
 $('modal').classList.remove('hidden');
 const tick=()=>{$('tm').textContent=`เหลือ ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;if(left--<=0)finishTest()};tick();timer=setInterval(tick,1000);
 document.addEventListener('visibilitychange',cheat)}
function endTest(){clearInterval(timer);document.removeEventListener('visibilitychange',cheat);closeModal();activeTest=null}
function cheat(){if(!document.hidden||!activeTest)return;const it=S.items.find(i=>i.id===activeTest);(S.subs[it.id]??={})[me.id]={status:'cheated',score:0,at:new Date().toISOString()};notify(`🚨 ${me.name} ถูกตัดสิทธิ์สอบ "${it.title}" (สลับหน้าจอ)`);putSub(it.id,me.id);endTest();save();render();toast('🚨 ตรวจพบการสลับหน้าจอ ถูกตัดสิทธิ์')}
async function finishTest(){
 if(!activeTest)return;const prev=sub(activeTest,me.id)||null;const it=S.items.find(i=>i.id===activeTest);let sc=0,es=false;
 const answers=it.questions.map((q,i)=>{const a=qt(q)==='mc'?(document.querySelector(`input[name=q${i}]:checked`)?.value||''):$('a'+i).value.trim();if(qt(q)==='essay')es=true;else if(ok(q,a))sc+=pts(q,it);return a});
 (S.subs[it.id]??={})[me.id]={status:(es||online())?'submitted':'graded',score:Math.round(sc*10)/10,answers,at:new Date().toISOString(),feedback:''};
 endTest();toast('กำลังส่งแบบทดสอบ...');
 const done=await putSub(it.id,me.id,null);

/* grading */
let gt=null,draw=false;
function markHtml(s){
 if(!s||!s.marks||!s.marks.length||!['graded','revision'].includes(s.status))return'';
 return'<div class="space-y-2"><b class="text-xs">🖍️ งานที่ครูตรวจ</b>'+s.marks.map(m=>{const f=(s.att||[])[m.i];return f?`<div class="relative"><img src="${esc(f.url)}" class="w-full rounded-xl border block"><img src="${esc(m.url)}" class="absolute inset-0 w-full h-full pointer-events-none"></div>`:''}).join('')+'</div>'}
function gAtt(x){
 return (x.att||[]).map((f,i)=>{
  if(!(f.ct||'').startsWith('image/'))return`<div><a href="${esc(f.url)}" target="_blank" rel="noopener" class="underline text-sky-600">📎 ${esc(f.name)}</a> <span class="text-slate-400">(เขียนตรวจได้เฉพาะรูปภาพ)</span></div>`;
  const m=(x.marks||[]).find(k=>k.i===i);
  return`<div class="space-y-1"><div class="text-[11px] font-bold">🖍️ ${esc(f.name)} <button type="button" onclick="mkClear(${i})" class="bg-slate-100 rounded-lg px-2 py-0.5">ล้างรอยเขียน</button></div><div class="relative"><img src="${esc(f.url)}" class="w-full rounded-xl border block">${m?`<img src="${esc(m.url)}" class="mo absolute inset-0 w-full h-full pointer-events-none">`:''}<canvas class="mk absolute inset-0 w-full h-full touch-none" data-i="${i}"></canvas></div></div>`}).join('')}
function mkClear(i){
 const c=document.querySelector('#modal canvas.mk[data-i="'+i+'"]');if(!c)return;
 c.getContext('2d').clearRect(0,0,c.width,c.height);c.dataset.dirty='1';
 const mo=c.parentElement.querySelector('.mo');if(mo)mo.style.display='none'}
function openGrade(iid,sid){
 gt={iid,sid};const it=S.items.find(i=>i.id===iid),st=S.students.find(s=>s.id===sid),x=sub(iid,sid)||{};
 const lateMsg=(x.late&&it.type!=='test')?'<div class="text-xs bg-amber-50 border border-amber-200 rounded-xl p-2 font-bold text-amber-800">⏰ ส่งช้า: ระบบจะหักอัตโนมัติ '+(Math.round(it.max/2*100)/100)+' คะแนน (ครึ่งหนึ่งของคะแนนเต็ม)</div>':'';
 $('modal').innerHTML=`<div class="card border-4 border-purple-200 p-5 w-full max-w-lg max-h-[90vh] overflow-y-auto space-y-3"><div><h3 class="mali font-bold">ตรวจ: ${esc(it.title)}</h3><p class="text-xs text-slate-500">${esc(st.name)}</p></div>
 <div class="text-xs bg-slate-50 rounded-xl p-2 break-words space-y-2">${it.type==='test'?ansHtml(it,x):esc(x.text)||'<i class="text-slate-400">ไม่มีข้อความ</i>'}${x.url?`<br><a class="text-sky-600 underline" target="_blank" rel="noopener" href="${esc(x.url)}">${esc(x.url)}</a>`:''}</div>
 ${gAtt(x)}
 ${lateMsg}
 <div class="grid grid-cols-2 gap-2 text-xs font-bold"><label>คะแนนที่ตรวจได้ (เต็ม ${it.max})<input id="gs" type="number" min="0" max="${it.max}" step="any" inputmode="decimal" value="${(x.raw??x.score)||0}" class="w-full border-2 border-slate-200 rounded-xl p-2 mt-1 font-normal"></label><label>สถานะ<select id="gst" class="w-full border-2 border-slate-200 rounded-xl p-2 mt-1 font-normal"><option value="graded">ตรวจแล้ว</option><option value="revision">ให้แก้ไข</option></select></label></div>
 <textarea id="gf" rows="2" class="w-full border-2 border-slate-200 rounded-xl p-2 text-xs" placeholder="ข้อติชม / คำแนะนำ (นักเรียนเห็น)">${esc(x.feedback)}</textarea>
 <div class="flex gap-2"><button onclick="closeModal()" class="bb flex-1 py-2 bg-slate-100 rounded-xl text-xs font-bold">ปิด</button><button onclick="saveGrade()" class="bb flex-1 py-2 bg-emerald-500 text-white rounded-xl text-xs font-bold">บันทึก</button></div></div>`;
 $('modal').classList.remove('hidden');
 document.querySelectorAll('#modal canvas.mk').forEach(c=>{
  const img=c.parentElement.querySelector('img'),g=c.getContext('2d');
  const init=()=>{const k=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight,1));c.width=Math.round(img.naturalWidth*k)||800;c.height=Math.round(img.naturalHeight*k)||600;g.strokeStyle='#ef4444';g.lineWidth=Math.max(3,c.width/160);g.lineCap='round';g.lineJoin='round'};
  if(img.complete&&img.naturalWidth)init();else img.addEventListener('load',init);
  const p=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
  c.onpointerdown=e=>{e.preventDefault();try{c.setPointerCapture(e.pointerId)}catch(_){}draw=true;c.dataset.dirty='1';const mo=c.parentElement.querySelector('.mo');if(mo)mo.style.display='none';g.beginPath();g.moveTo(...p(e))};
  c.onpointermove=e=>{if(draw){g.lineTo(...p(e));g.stroke()}};
  c.onpointerup=c.onpointercancel=()=>draw=false})}
async function saveGrade(){
 const{iid,sid}=gt,it=S.items.find(i=>i.id===iid);
 const prev=(S.subs[iid]||{})[sid]||{};
 const raw=Math.round(Math.min(Math.max(parseFloat($('gs').value)||0,0),it.max)*100)/100;
 const pen=(prev.late&&it.type!=='test')?it.max/2:0;
 const score=Math.round(Math.max(0,raw-pen)*100)/100;
 const status=$('gst').value,feedback=$('gf').value;
 let marks=[...(prev.marks||[])];
 const cs=[...document.querySelectorAll('#modal canvas.mk')].filter(c=>c.dataset.dirty==='1');
 if(cs.length)toast('กำลังบันทึกรอยเขียน...');
 try{for(const c of cs){const i=+c.dataset.i;const b=await new Promise(r=>c.toBlob(r,'image/png'));if(b.size>8*1024*1024)throw new Error('รอยเขียนใหญ่เกิน 8 MB');const f=new File([b],'mark-'+iid+'-'+sid+'-'+i+'.png',{type:'image/png'});const r=await ASSETS.upload(f);marks=marks.filter(m=>m.i!==i);marks.push({i,url:r.url,name:f.name,ct:'image/png'})}}
 catch(e){return toast('บันทึกรอยเขียนไม่สำเร็จ: '+((e&&e.message)||''))}
 const x=(S.subs[iid]??={});
 x[sid]={at:new Date().toISOString(),...x[sid],status,raw,score,feedback,marks};
 putSub(iid,sid);save();closeModal();render();toast(pen?'บันทึกแล้ว (หักส่งช้า '+pen+' คะแนน)':'บันทึกผลการตรวจแล้ว')}

/* grades (8 levels) */
function calc(sid){let m=0,e=0;tasks().forEach(t=>{m+=t.max||10;const x=sub(t.id,sid);if(x?.status==='graded')e+=x.score||0});
 const b=S.bonus.filter(x=>x.sid===sid).reduce((a,x)=>a+(+x.pts||0),0);const p=m?Math.min(100,(e+b)/m*100):0;const g=p>=80?'A':p>=75?'B+':p>=70?'B':p>=65?'C+':p>=60?'C':p>=55?'D+':p>=50?'D':'F';return{p:p.toFixed(1),g,b}}
function vGrades(){
 const T=tasks();
 return head('🏅 ผลการเรียน (เฉพาะครู)','A 80+ • B+ 75 • B 70 • C+ 65 • C 60 • D+ 55 • D 50 • F &lt;50',`<button onclick="copyCsv()" class="bb bg-emerald-500 text-white px-4 py-2 rounded-2xl text-xs font-bold shrink-0">📋 คัดลอก CSV</button>`)+`<div class="card overflow-x-auto"><table class="w-full text-xs text-left"><thead class="bg-yellow-50 font-bold"><tr><th class="p-3">เลขที่</th><th class="p-3">ชื่อ-นามสกุล</th>${T.map(t=>`<th class="p-3 text-center">${esc(t.title.split(':')[0])}</th>`).join('')}<th class="p-3 text-center text-purple-700">พิเศษ</th><th class="p-3 text-center bg-amber-100">รวม %</th><th class="p-3 text-center bg-amber-200">เกรด</th></tr></thead><tbody class="divide-y">${S.students.map(s=>{const r=calc(s.id);return`<tr><td class="p-3 font-bold">${s.no}</td><td class="p-3">${esc(s.name)}</td>${T.map(t=>{const x=sub(t.id,s.id);return`<td class="p-3 text-center">${x?.status==='graded'?x.score:'-'}</td>`}).join('')}<td class="p-3 text-center font-bold text-purple-700">${r.b?(r.b>0?"+":"")+r.b:"-"}</td><td class="p-3 text-center font-bold bg-amber-50">${r.p}%</td><td class="p-3 text-center font-bold text-purple-700 bg-amber-100">${r.g}</td></tr>`}).join('')}</tbody></table></div>`}
function copyCsv(){
 const csv='เลขที่,รหัส,ชื่อ-นามสกุล,คะแนน(%),เกรด\n'+S.students.map(s=>{const r=calc(s.id);return[s.no,s.code,s.name,r.p,r.g].join(',')}).join('\n');
 (navigator.clipboard?navigator.clipboard.writeText(csv):Promise.reject()).then(()=>toast('คัดลอก CSV แล้ว วางใน Excel/Sheets ได้เลย'),()=>toast('คัดลอกไม่สำเร็จ'))}
</script>

<script>
/* ===== ต้องเข้าสู่ระบบก่อนเสมอ (ครู/นักเรียน) + นักเรียนสลับเป็นครูไม่ได้ ===== */
(function(){
 const TEACHER_TABS=['room','students','grades','bonus'];
 const TEACHER_USERS=['admin'];
 const _sr=setRole,_render=render;
 const rb=$('r-teacher').parentElement;
 const lo=document.createElement('button');
 lo.className='bb bg-white border-2 border-pink-200 rounded-2xl px-3 py-1.5 text-sm hidden';
 lo.title='ออกจากระบบ';lo.textContent='🚪';lo.onclick=logout;
 rb.parentElement.insertBefore(lo,rb);

 const ov=document.createElement('div');
 ov.className='fixed inset-0 z-[100] flex items-center justify-center p-4';
 ov.style.cssText='background:linear-gradient(135deg,#fdf4ff,#f0f9ff 50%,#f0fdf4)';
 document.body.appendChild(ov);
 let busyLogin=false;
 const ic='w-full border-2 border-slate-200 rounded-xl p-2 mt-1 font-normal';
 function drawGate(msg){
  ov.innerHTML=`<div class="card border-4 border-pink-200 p-6 w-full max-w-sm space-y-3"><div class="text-center"><div class="text-5xl">🐥</div><h1 class="mali font-bold text-xl">Classroom by KRU.yui</h1><p class="text-xs text-slate-500">${msg||'กรุณาเข้าสู่ระบบก่อนใช้งาน'}</p></div>
  <label class="block text-xs font-bold">ชื่อผู้ใช้ / รหัสประจำตัวนักเรียน<input id="g-u" class="${ic}" autocomplete="off" autocapitalize="off"></label>
  <label class="block text-xs font-bold">รหัสผ่าน<input id="g-p" type="password" class="${ic}"></label>
  <button id="g-go" class="bb w-full py-2.5 bg-pink-400 text-white rounded-2xl text-xs font-bold">เข้าสู่ระบบ</button>
  <p class="text-[10px] text-slate-400 text-center">นักเรียน: รหัสประจำตัว + รหัสผ่านห้องเรียน</p></div>`;
  $('g-go').onclick=login;
  ov.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')login()})}
 async function login(){
  if(busyLogin)return;busyLogin=true;$('g-go').textContent='กำลังตรวจสอบ...';
  try{
   const u=$('g-u').value.trim(),p=$('g-p').value.trim();
   if(!u)return drawGate('กรอกชื่อผู้ใช้หรือรหัสประจำตัว');

    if(!online())return drawGate('ยังไม่ได้ตั้งค่า GAS_URL');
    const x=await fetch(GAS_URL+'?action=auth&key='+encodeURIComponent(p)).then(r=>r.json()).catch(()=>({}));
    if(!x.ok)return drawGate('❌ ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');

    AUTH=true;me=null;_sr('teacher');pull();
   }else{
    await pull();
    const f=S.students.find(x=>x.code===u);
    if(!f||!(await pwOk(p)))return drawGate('❌ ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
    me=f;role='student';try{sessionStorage.setItem('lms_stu',JSON.stringify({code:f.code,rid:S.cur}))}catch(e){}render();pull();
   }
   closeModal();render();
  }finally{busyLogin=false}}

 render=function(){

  if(role!=='teacher'&&TEACHER_TABS.includes(tab))tab='dashboard';
  _render();
  document.querySelectorAll('#view textarea[id^=t_],#view input[id^=u_]').forEach(e=>{if(DR[e.id]!=null)e.value=DR[e.id]});

  if(!authed&&!ov.firstChild)drawGate();
  rb.classList.toggle('hidden',!AUTH);lo.classList.toggle('hidden',!authed);
  if(role==='student'&&me)$('who').insertAdjacentHTML('beforeend',`<br><button onclick="logout()" class="bb mt-2 px-3 py-1.5 bg-slate-100 rounded-xl font-bold">ออกจากระบบ</button>`);
 };
 setRole=function(r){
  if(r==='teacher'&&!AUTH){toast('ไม่มีสิทธิ์เข้ามุมมองครู');return}
  _sr(r)};

 async function logout(){
  clearTimeout(pend);
  if(AUTH&&unsaved){try{await flush()}catch(e){}}
  AUTH=false;KEY='';try{localStorage.removeItem('lms_key');sessionStorage.removeItem('lms_stu');sessionStorage.removeItem('lms_dr')}catch(e){}
  Object.keys(DR).forEach(k=>delete DR[k]);
  role='student';me=null;tab='dashboard';closeModal();ov.innerHTML='';render()}
 window.logout=logout;

 role='student';me=null;closeModal();render();
 if(online())$('st').textContent='⏳ กำลังเชื่อมต่อ Google Drive...';
 (async()=>{
  if(KEY&&online()){
   drawGate('กำลังตรวจสอบสิทธิ์...');
   const x=await fetch(GAS_URL+'?action=auth&key='+encodeURIComponent(KEY)).then(r=>r.json()).catch(()=>null);
   if(x&&x.ok){AUTH=true;_sr('teacher');render();if(unsaved)setTimeout(flush,1200)}
   else{if(x){KEY='';unsaved=false;try{localStorage.removeItem('lms_key');localStorage.removeItem('lms_unsaved')}catch(e){}}drawGate()}
  }
  try{
   const ss=JSON.parse(sessionStorage.getItem('lms_stu')||'null');
   if(ss&&!AUTH&&online()){
    await pull();
    if(!hashRoom()&&ss.rid&&S.rooms.some(r=>r.id===ss.rid))useRoom(ss.rid);
    const f=S.students.find(x=>x.code===ss.code);
    if(f){me=f;role='student';render();pull()}
   }
  }catch(e){}
  if(!me)pull();
  setInterval(()=>{if(document.hidden)return;if(role==='teacher'&&(pend||inflight||unsaved))return;pull()},role==='teacher'?30000:20000);
 })();
})();
